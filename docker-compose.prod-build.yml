# Fallback tecnico: reconstruye imagenes prod docente localmente.
# La ruta normal de docente-local es image-first via GHCR.
services:
  api_docente_prod:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile

  web_docente_prod:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:4000/api
        - VITE_APP_DESTINO=docente

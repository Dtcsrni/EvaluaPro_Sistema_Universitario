# Dependabot policy:
# - keep security capabilities available in GitHub
# - stop automatic version-update PR churn on main
# - make the repository's single-branch policy explicit
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Mexico_City"
    target-branch: "main"
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "dependabot"

  - package-ecosystem: "npm"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Mexico_City"
    target-branch: "main"
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "dependabot"

  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Mexico_City"
    target-branch: "main"
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "dependabot"

  - package-ecosystem: "npm"
    directory: "/apps/portal_alumno_cloud"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Mexico_City"
    target-branch: "main"
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "dependabot"

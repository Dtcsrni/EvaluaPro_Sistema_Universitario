# Dependabot policy:
# - keep security capabilities available in GitHub
# - review routine version updates in bounded Dependabot PR batches
# - keep security updates enabled; GitHub handles them separately from the version-update limit
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/apps/portal_alumno_cloud"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

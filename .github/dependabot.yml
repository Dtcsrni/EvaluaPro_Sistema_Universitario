# Dependabot policy:
# - update npm workspaces from the repository root so manifests and the root lock move together
# - review bounded weekly batches and automatically rebase update branches
# - keep GitHub security updates enabled; they are handled separately from version updates
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

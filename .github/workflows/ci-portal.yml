name: CI Portal Module

on:
  push:
    paths:
      - "apps/portal_alumno_cloud/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "vitest.base.ts"
      - "scripts/retry.mjs"
      - "scripts/testing/**"
      - "scripts/security-env-check.mjs"
      - ".github/workflows/ci-portal.yml"
  pull_request:
    paths:
      - "apps/portal_alumno_cloud/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "vitest.base.ts"
      - "scripts/retry.mjs"
      - "scripts/testing/**"
      - "scripts/security-env-check.mjs"
      - ".github/workflows/ci-portal.yml"
  workflow_dispatch:

concurrency:
  group: ci-portal-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detectar_cambios:
    name: Detectar Cambios Portal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      escalation: ${{ steps.affected.outputs.escalation }}
      portal: ${{ steps.affected.outputs.group_portal }}
      shared: ${{ steps.affected.outputs.group_shared }}
      job_core_backend_portal: ${{ steps.affected.outputs.job_core_backend_portal }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolver impacto canónico de CI
        id: affected
        run: node scripts/testing/resolve-affected-ci.mjs --github-output="$GITHUB_OUTPUT" > reports.affected-ci.json

  portal_module:
    name: Portal Module
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - detectar_cambios
    if: github.event_name == 'workflow_dispatch' || needs.detectar_cambios.outputs.portal == 'true' || needs.detectar_cambios.outputs.shared == 'true' || needs.detectar_cambios.outputs.job_core_backend_portal == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Etapa setup
        run: npm ci --foreground-scripts

      - name: Etapa lint portal
        run: npm -C apps/portal_alumno_cloud run lint

      - name: Etapa typecheck portal
        run: npm -C apps/portal_alumno_cloud run typecheck

      - name: Etapa test portal
        run: npm run test:portal:ci

      - name: Etapa coverage portal
        run: npm -C apps/portal_alumno_cloud run test:coverage

      - name: Etapa tdd-debt-check
        run: npm run test:coverage:exclusions:debt

      - name: Preparar base para diff coverage (PR)
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Etapa diff-coverage-check
        run: npm run test:coverage:diff -- --apps portal

      - name: Etapa build portal
        run: npm -C apps/portal_alumno_cloud run build

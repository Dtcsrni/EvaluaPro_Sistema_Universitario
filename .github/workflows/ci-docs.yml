name: CI Docs Module

on:
  push:
    branches:
      - "main"
      - "release/**"
    paths:
      - "docs/**"
      - "ci/pipeline.contract.md"
      - "ci/pipeline.matrix.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "ci/pipeline.contract.md"
      - "ci/pipeline.matrix.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-docs.yml"
  workflow_dispatch:

concurrency:
  group: ci-docs-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detectar_cambios:
    name: Detectar Cambios Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      escalation: ${{ steps.affected.outputs.escalation }}
      docs: ${{ steps.affected.outputs.group_docs }}
      installer: ${{ steps.affected.outputs.group_installer }}
      release: ${{ steps.affected.outputs.group_release }}
      shared: ${{ steps.affected.outputs.group_shared }}
      job_core_contract_docs_gov: ${{ steps.affected.outputs.job_core_contract_docs_gov }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolver impacto canónico de CI
        id: affected
        run: node scripts/testing/resolve-affected-ci.mjs --github-output="$GITHUB_OUTPUT" > reports.affected-ci.json

  docs_module:
    name: Docs Module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - detectar_cambios
    if: github.event_name == 'workflow_dispatch' || needs.detectar_cambios.outputs.docs == 'true' || needs.detectar_cambios.outputs.installer == 'true' || needs.detectar_cambios.outputs.release == 'true' || needs.detectar_cambios.outputs.shared == 'true' || needs.detectar_cambios.outputs.job_core_contract_docs_gov == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Etapa setup
        run: npm ci --foreground-scripts

      - name: Etapa contract-check
        run: npm run pipeline:contract:check

      - name: Etapa docs-check
        run: |
          npm run docs:generate
          npm run docs:check

      - name: Etapa diagramas-check
        run: npm run diagramas:check

      - name: Etapa diagramas-render
        run: |
          rm -rf ~/.cache/puppeteer
          node scripts/install-chrome.mjs
          npm run diagramas:render

      - name: Etapa diagramas-consistencia-check
        run: npm run diagramas:consistencia:check

      - name: Etapa routes-check
        run: npm run routes:check

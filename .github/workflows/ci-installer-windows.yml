name: CI Installer Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-installer-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  installer_windows:
    name: Installer Windows (MSI + Bundle)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Configurar .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Etapa setup
        run: npm ci --foreground-scripts

      - name: Instalar WiX CLI estable (v6.0.2)
        shell: powershell
        run: |
          dotnet tool install --global wix --version 6.0.2

      - name: Registrar WiX en PATH y Validar Versión
        shell: powershell
        run: |
          $dotnetToolsDir = Join-Path $env:USERPROFILE ".dotnet\tools"
          if (-not (Test-Path $dotnetToolsDir)) {
            New-Item -ItemType Directory -Path $dotnetToolsDir -Force | Out-Null
          }
          "$dotnetToolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wixPath = Join-Path $dotnetToolsDir "wix.exe"
          if (-not (Test-Path $wixPath)) {
            throw "No se encontro wix.exe en la carpeta de herramientas .NET global ($dotnetToolsDir)"
          }
          $wixVersion = (& $wixPath --version | Select-Object -First 1)
          if ($wixVersion -notmatch '^6\.0\.\d+(?:[+\-].*)?$') { throw "Version WiX no permitida: $wixVersion. Se requiere 6.0.x." }
          Write-Host "WiX version detectada: $wixVersion"

      - name: Etapa policy-check WiX
        run: npm run test:wix:policy

      - name: Etapa contract-check Installer Hub
        env:
          EVALUAPRO_INSTALLER_SIMULATE_WSL_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_SIMULATE_AUTO_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_AUTO_BOOTSTRAP_WSL: '1'
          EVALUAPRO_LICENSE_ACTIVATION_SIMULATE: '1'
        run: npm run test:installer-hub:contract

      - name: Etapa build MSI + Bundle
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-msi.ps1 -SkipStabilityChecks -IncludeBundle -Flavor all

      - name: Gate footprint bundle docente
        run: npm run installer:docente:baseline:enforce

      - name: Smoke GUI del bundle Burn publico empaquetado
        shell: powershell
        run: |
          $exe = Get-ChildItem -LiteralPath 'dist/installer/docente-local' -Filter 'EvaluaPro-InstallerHub-docente-local-v*.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "No existe dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe" }
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 2
          if ($proc.HasExited) { throw 'El Installer Hub empaquetado se cerro antes del smoke timeout.' }
          Start-Sleep -Seconds 3
          if (-not $proc.HasExited) {
            try { Stop-Process -Id $proc.Id -Force } catch {}
          }

      - name: Etapa hash/manifest de release instalador
        shell: powershell
        run: |
          $isTag = "${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true"
          if ($isTag) {
            $tag = "${{ github.ref_name }}"
            $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-installer-hashes.ps1 -ReleaseBaseUrl "$base"
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-installer-hashes.ps1
          }

      - name: Antivirus gate del Installer Hub
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/run-defender-scan.ps1 -TargetPath 'dist/installer' -ReportPath 'dist/installer/antivirus-scan-report.txt'

      - name: Etapa signing gate (opcional)
        shell: powershell
        env:
          EVALUAPRO_SIGN_CERT_BASE64: ${{ secrets.EVALUAPRO_SIGN_CERT_BASE64 }}
          EVALUAPRO_SIGN_CERT_PASSWORD: ${{ secrets.EVALUAPRO_SIGN_CERT_PASSWORD }}
          EVALUAPRO_SIGN_TIMESTAMP_URL: ${{ secrets.EVALUAPRO_SIGN_TIMESTAMP_URL }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-installer-artifacts.ps1

      - name: Verificar artefactos
        shell: powershell
        run: |
          $saasExeList = @(Get-ChildItem -LiteralPath 'dist/installer/saas-completo' -Filter 'EvaluaPro-InstallerHub-saas-completo-v*.exe' -File | Sort-Object LastWriteTime -Descending)
          if ($saasExeList.Count -eq 0) { throw "No existe dist/installer/saas-completo/EvaluaPro-InstallerHub-saas-completo-v*.exe" }
          $saasExe = $saasExeList[0]
          # Eliminar versiones viejas residuales
          for ($i = 1; $i -lt $saasExeList.Count; $i++) {
              Write-Host "Limpiando version antigua: $($saasExeList[$i].FullName)"
              Remove-Item -Path $saasExeList[$i].FullName -Force
              if (Test-Path ($saasExeList[$i].FullName + '.sha256')) { Remove-Item -Path ($saasExeList[$i].FullName + '.sha256') -Force }
          }

          $docExeList = @(Get-ChildItem -LiteralPath 'dist/installer/docente-local' -Filter 'EvaluaPro-InstallerHub-docente-local-v*.exe' -File | Sort-Object LastWriteTime -Descending)
          if ($docExeList.Count -eq 0) { throw "No existe dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe" }
          $docExe = $docExeList[0]
          # Eliminar versiones viejas residuales
          for ($i = 1; $i -lt $docExeList.Count; $i++) {
              Write-Host "Limpiando version antigua: $($docExeList[$i].FullName)"
              Remove-Item -Path $docExeList[$i].FullName -Force
              if (Test-Path ($docExeList[$i].FullName + '.sha256')) { Remove-Item -Path ($docExeList[$i].FullName + '.sha256') -Force }
          }
          
          if (-not (Test-Path ($saasExe.FullName + '.sha256'))) { throw "No existe hash para $($saasExe.Name)" }
          if (-not (Test-Path ($docExe.FullName + '.sha256'))) { throw "No existe hash para $($docExe.Name)" }
          if (Test-Path "dist/installer/EvaluaPro-InstallerHub-saas-completo.exe") { throw "No debe existir nombre legacy sin version: dist/installer/EvaluaPro-InstallerHub-saas-completo.exe" }
          if (Test-Path "dist/installer/EvaluaPro-InstallerHub-docente-local.exe") { throw "No debe existir nombre legacy sin version: dist/installer/EvaluaPro-InstallerHub-docente-local.exe" }
          if (-not (Test-Path "dist/installer/EvaluaPro-release-manifest.json")) { throw "No existe dist/installer/EvaluaPro-release-manifest.json" }
          if (-not (Test-Path "dist/installer/antivirus-scan-report.txt")) { throw "No existe dist/installer/antivirus-scan-report.txt" }
          if (-not (Test-Path "dist/installer/_internal/saas-completo/EvaluaPro-saas-completo.msi")) { throw "No existe dist/installer/_internal/saas-completo/EvaluaPro-saas-completo.msi" }
          if (-not (Test-Path "dist/installer/_internal/docente-local/EvaluaPro-docente-local.msi")) { throw "No existe dist/installer/_internal/docente-local/EvaluaPro-docente-local.msi" }
          if (Test-Path "dist/installer/EvaluaPro-saas-completo.msi") { throw "MSI tecnico no debe quedar en raiz publica: dist/installer/EvaluaPro-saas-completo.msi" }
          if (Test-Path "dist/installer/EvaluaPro-docente-local.msi") { throw "MSI tecnico no debe quedar en raiz publica: dist/installer/EvaluaPro-docente-local.msi" }

      - name: Publicar artefactos instalador
        uses: actions/upload-artifact@v6
        with:
          name: installer-windows
          path: |
            dist/installer/saas-completo/EvaluaPro-InstallerHub-saas-completo-v*.exe
            dist/installer/saas-completo/EvaluaPro-InstallerHub-saas-completo-v*.exe.sha256
            dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe
            dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe.sha256
            dist/installer/antivirus-scan-report.txt
            dist/installer/EvaluaPro-release-manifest.json
            dist/installer/SIGNING-NOT-PRODUCTION.txt

      - name: Publicar artefactos internos instalador
        uses: actions/upload-artifact@v6
        with:
          name: installer-windows-internal
          path: |
            dist/installer/_internal/**

      - name: Publicar release assets (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        id: stable_release_assets
        shell: bash
        run: |
          set -euo pipefail
          files=(
            dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe
            dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe.sha256
            "dist/installer/EvaluaPro-release-manifest.json"
            "dist/installer/antivirus-scan-report.txt"
          )
          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publicar release assets (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          make_latest: false
          files: ${{ steps.stable_release_assets.outputs.files }}

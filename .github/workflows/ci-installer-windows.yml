name: CI Installer Windows

on:
  pull_request:
  push:
    tags:
      - "hub-v*"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "SHA completo de main para construir el artefacto candidato"
        required: true
        type: string
      release_tag:
        description: "Tag del Installer Hub (hub-vX.Y.Z), se publica después de verificar assets"
        required: false
        type: string
      candidate_run_id:
        description: "Run exitoso del mismo SHA con bundle y E2E completos para reutilizar por digest"
        required: false
        type: string

concurrency:
  group: ci-installer-windows-${{ inputs.release_tag != '' && format('release-{0}', inputs.release_tag) || startsWith(github.ref, 'refs/tags/hub-v') && format('release-{0}', github.ref) || github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.head.repo.full_name, github.event.pull_request.head.ref) || github.event_name == 'push' && format('push-{0}', github.ref) || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/hub-v')) }}

permissions:
  contents: read

jobs:
  detectar_cambios:
    name: Detectar módulos para Installer Windows
    runs-on: ubuntu-latest
    outputs:
      run_installer: ${{ steps.resolve.outputs.run_installer || steps.resolve_non_pr.outputs.run_installer }}
    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolver cambios de PR
        id: resolve
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/testing/resolve-affected-ci.mjs --github-output="$GITHUB_OUTPUT" > affected-ci.json
          PR_CHANGED_PATHS_OUTPUT="$(git diff --name-only "$PULL_REQUEST_BASE_SHA...$PULL_REQUEST_HEAD_SHA")"
          mapfile -t PR_CHANGED_PATHS <<< "$PR_CHANGED_PATHS_OUTPUT"
          RELEASE_CONTROL_ONLY=true
          RELEASE_CONTROL_PATHS=(
            '.github/workflows/ci-installer-windows.yml'
            '.github/workflows/release-stable-gate.yml'
            'scripts/tests/ci-workflow-contract.test.mjs'
            'scripts/tests/installer-upgrade-e2e-contract.test.mjs'
            'docs/specs/SPEC-122_estabilizacion_release_1_2_8.spec.md'
          )
          if [[ ${#PR_CHANGED_PATHS[@]} -eq 0 ]]; then
            RELEASE_CONTROL_ONLY=false
          else
            for changed_path in "${PR_CHANGED_PATHS[@]}"; do
              allowed=false
              for allowed_path in "${RELEASE_CONTROL_PATHS[@]}"; do
                [[ "$changed_path" == "$allowed_path" ]] && allowed=true && break
              done
              if [[ "$allowed" != true ]]; then
                RELEASE_CONTROL_ONLY=false
                break
              fi
            done
          fi
          if [[ "$RELEASE_CONTROL_ONLY" == true ]]; then
            echo 'run_installer=false' >> "$GITHUB_OUTPUT"
            echo 'Solo cambiaron controles del release; se omiten build y E2E de Windows.' >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eq '^group_(installer|backend|frontend|portal|shared)=true$' "$GITHUB_OUTPUT"; then
            echo 'run_installer=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_installer=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Habilitar build fuera de PR
        id: resolve_non_pr
        if: github.event_name != 'pull_request'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "push" && "$PUSH_REF" == "refs/heads/main" && "$PUSH_BEFORE_SHA" =~ ^[0-9a-fA-F]{40}$ && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if ! CHANGED_PATHS_OUTPUT="$(git diff --name-only "$PUSH_BEFORE_SHA...${GITHUB_SHA}")"; then
              echo 'run_installer=true' >> "$GITHUB_OUTPUT"
              echo 'No se pudo clasificar el push; se conserva la validación completa de Installer Windows.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ -n "$CHANGED_PATHS_OUTPUT" ]]; then
              mapfile -t CHANGED_PATHS <<< "$CHANGED_PATHS_OUTPUT"
              VERSION="$(node -p "require('./config/hub-version.json').version")"
              EVIDENCE_PREFIX="docs/release/evidencias/$VERSION/"
              RELEASE_CONTROL_PATHS=(
                '.github/workflows/ci-installer-windows.yml'
                '.github/workflows/release-stable-gate.yml'
                'scripts/tests/ci-workflow-contract.test.mjs'
                'scripts/tests/installer-upgrade-e2e-contract.test.mjs'
                'docs/specs/SPEC-122_estabilizacion_release_1_2_8.spec.md'
              )
              RELEASE_CONTROL_ONLY=true
              for changed_path in "${CHANGED_PATHS[@]}"; do
                allowed=false
                if [[ "$changed_path" == "$EVIDENCE_PREFIX"* ]]; then
                  allowed=true
                else
                  for allowed_path in "${RELEASE_CONTROL_PATHS[@]}"; do
                    [[ "$changed_path" == "$allowed_path" ]] && allowed=true && break
                  done
                fi
                if [[ "$allowed" != true ]]; then
                  RELEASE_CONTROL_ONLY=false
                  break
                fi
              done
              if [[ "$RELEASE_CONTROL_ONLY" == true ]]; then
                echo 'run_installer=false' >> "$GITHUB_OUTPUT"
                echo 'Push de main limitado a controles/evidencia de release; se omiten build y E2E de Windows.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
          echo 'run_installer=true' >> "$GITHUB_OUTPUT"

  installer_windows_build:
    name: Installer Windows Build (MSI + Bundle)
    needs: detectar_cambios
    outputs:
      bundle_sha256: ${{ steps.candidate_digest.outputs.bundle_sha256 }}
    if: ${{ (github.event_name != 'pull_request' || needs.detectar_cambios.outputs.run_installer == 'true') && !(github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != '') }}
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Verificar el SHA de origen
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'source_sha debe ser un SHA completo.' }
          $checkedOut = (& git rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:SOURCE_SHA.ToLowerInvariant()) { throw 'El checkout no coincide con source_sha.' }
          $mainSha = (& git rev-parse origin/main).Trim()
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^hub-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'release_tag debe ser SemVer estable hub-vX.Y.Z.' }
            $version = [string](Get-Content -Raw -LiteralPath 'config/hub-version.json' | ConvertFrom-Json).version
            if ($env:RELEASE_TAG -ne "hub-v$version") { throw 'release_tag no coincide con la versión del SHA candidato.' }
            & git merge-base --is-ancestor $checkedOut $mainSha
            if ($LASTEXITCODE -ne 0) { throw 'El SHA candidato no es ancestro del HEAD actual de main.' }
            $changed = @(& git diff --name-only "$checkedOut..$mainSha")
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo comparar el SHA candidato con main.' }
            $expectedPrefix = "docs/release/evidencias/$version/"
            $allowedPostCandidatePaths = @(
              '.github/workflows/ci-installer-windows.yml',
              '.github/workflows/release-stable-gate.yml',
              'scripts/tests/ci-workflow-contract.test.mjs',
              'scripts/tests/installer-upgrade-e2e-contract.test.mjs',
              'docs/specs/SPEC-122_estabilizacion_release_1_2_8.spec.md'
            )
            $unexpectedChangedPaths = @($changed | Where-Object {
              -not ($_.StartsWith($expectedPrefix, [System.StringComparison]::Ordinal) -or $allowedPostCandidatePaths -ccontains $_)
            })
            if ($unexpectedChangedPaths.Count -gt 0) {
              throw "Después del SHA candidato solo se permiten evidencias de esta versión y controles acotados de release: $($unexpectedChangedPaths -join ', ')"
            }
          } elseif ($mainSha -ne $checkedOut) { throw 'El SHA candidato debe ser el HEAD actual de main.' }

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Configurar .NET SDK 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Etapa setup
        run: |
          npm install --global npm@12.2.1
          npm ci --foreground-scripts

      - name: Instalar WiX CLI estable (v7.0.0)
        shell: powershell
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7

      - name: Registrar WiX en PATH y Validar Versión
        shell: powershell
        run: |
          $dotnetToolsDir = Join-Path $env:USERPROFILE ".dotnet\tools"
          if (-not (Test-Path $dotnetToolsDir)) {
            New-Item -ItemType Directory -Path $dotnetToolsDir -Force | Out-Null
          }
          "$dotnetToolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wixPath = Join-Path $dotnetToolsDir "wix.exe"
          if (-not (Test-Path $wixPath)) {
            throw "No se encontro wix.exe en la carpeta de herramientas .NET global ($dotnetToolsDir)"
          }
          $wixVersion = (& $wixPath --version | Select-Object -First 1)
          if ($wixVersion -notmatch '^7\.0\.\d+(?:[+\-].*)?$') { throw "Version WiX no permitida: $wixVersion. Se requiere 7.0.x." }
          Write-Host "WiX version detectada: $wixVersion"

      - name: Etapa policy-check WiX
        run: npm run test:wix:policy

      - name: Etapa contract-check Installer Hub
        env:
          EVALUAPRO_INSTALLER_SIMULATE_WSL_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_SIMULATE_AUTO_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_AUTO_BOOTSTRAP_WSL: '1'
          EVALUAPRO_LICENSE_ACTIVATION_SIMULATE: '1'
        run: npm run test:installer-hub:contract

      - name: Etapa build MSI + Bundle docente-local
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-msi.ps1 -SkipStabilityChecks -IncludeBundle -Flavor docente-local

      - name: Compilar fixture Burn relacionado de la misma versión
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/hub-v') || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $candidate = Get-ChildItem -LiteralPath 'dist/installer/docente-local' -Filter 'EvaluaPro-InstallerHub-docente-local-v*.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $candidate) { throw 'No existe el bundle candidato docente-local para derivar su versión.' }
          $fixtureOutput = Join-Path $env:RUNNER_TEMP 'EvaluaPro-QA-SameVersionRelatedBundle.exe'
          & scripts/tests/build-same-version-related-bundle-fixture.ps1 -CandidateBundlePath $candidate.FullName -OutputPath $fixtureOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previousFixtureOutput = Join-Path $env:RUNNER_TEMP 'EvaluaPro-QA-PreviousVersionRelatedBundle.exe'
          & scripts/tests/build-same-version-related-bundle-fixture.ps1 -CandidateBundlePath $candidate.FullName -OutputPath $previousFixtureOutput -FixtureVersion '1.2.0.0' -EnvironmentVariableName 'PREVIOUS_VERSION_RELATED_BUNDLE_PATH'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gate footprint bundle docente
        run: npm run installer:docente:baseline:enforce

      - name: Smoke GUI del bundle Burn publico empaquetado
        shell: powershell
        run: |
          $exe = Get-ChildItem -LiteralPath 'dist/installer/docente-local' -Filter 'EvaluaPro-InstallerHub-docente-local-v*.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "No existe dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe" }
          function Get-ActiveInstallerHubProcess {
            @(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object {
              $_.Name -like 'EvaluaPro-InstallerHub*.exe' -or $_.Name -eq 'EvaluaPro.BurnBootstrapperApp.exe'
            } | Select-Object ProcessId, Name, ParentProcessId)
          }
          $preexistingProcesses = @()
          $baselineCaptured = $false
          $proc = $null
          $smokeLaunchedAt = $null
          try {
            $preexistingProcesses = @(Get-ActiveInstallerHubProcess)
            $baselineCaptured = $true
            if ($preexistingProcesses.Count -gt 0) {
              $details = ($preexistingProcesses | ForEach-Object { "{0}:{1}" -f $_.Name, $_.ProcessId }) -join ', '
              throw "El runner ya tenía procesos Installer Hub antes del smoke: $details"
            }
            $smokeLaunchedAt = [DateTime]::UtcNow
            $proc = Start-Process -FilePath $exe.FullName -PassThru
            $startupDeadline = (Get-Date).AddSeconds(15)
            $uiProcesses = @()
            do {
              $uiProcesses = @(Get-ActiveInstallerHubProcess | Where-Object {
                $_.Name -eq 'EvaluaPro.BurnBootstrapperApp.exe' -and $_.ProcessId -notin @($preexistingProcesses | ForEach-Object { $_.ProcessId })
              })
              if ($uiProcesses.Count -gt 0) { break }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $startupDeadline)
            if ($uiProcesses.Count -eq 0) {
              $proc.Refresh()
              $exitDetail = if ($proc.HasExited) { " código=$($proc.ExitCode)" } else { ' sigue activo sin iniciar su BA WPF' }
              throw "El bundle Burn no mantuvo activo EvaluaPro.BurnBootstrapperApp.exe tras el arranque.$exitDetail"
            }
            Start-Sleep -Seconds 3
            $uiProcesses = @(Get-ActiveInstallerHubProcess | Where-Object {
              $_.Name -eq 'EvaluaPro.BurnBootstrapperApp.exe' -and $_.ProcessId -notin @($preexistingProcesses | ForEach-Object { $_.ProcessId })
            })
            if ($uiProcesses.Count -eq 0) { throw 'La interfaz WPF del Installer Hub se cerró antes del smoke timeout.' }
          } catch {
            Write-Output "SMOKE_BURN_FAILURE: $($_.Exception.GetType().FullName): $($_.Exception.Message)"
            try {
              $activeProcesses = @(Get-ActiveInstallerHubProcess)
              if ($activeProcesses.Count -gt 0) {
                Write-Output 'SMOKE_BURN_ACTIVE_PROCESSES:'
                $activeProcesses | ForEach-Object { Write-Output ("{0}:{1}:parent={2}" -f $_.Name, $_.ProcessId, $_.ParentProcessId) }
              }

              if ($smokeLaunchedAt) {
                $logRoot = Join-Path $env:ProgramData 'EvaluaPro\installer-hub\logs'
                if (Test-Path -LiteralPath $logRoot -PathType Container) {
                  $sessionLogs = @(Get-ChildItem -LiteralPath $logRoot -Filter 'burn-bootstrapper.log' -File -Recurse -ErrorAction SilentlyContinue |
                    Where-Object { $_.LastWriteTimeUtc -ge $smokeLaunchedAt } |
                    Sort-Object LastWriteTimeUtc -Descending |
                    Select-Object -First 3)
                  foreach ($sessionLog in $sessionLogs) {
                    Write-Output "SMOKE_BURN_SESSION_LOG: $($sessionLog.FullName)"
                    Get-Content -LiteralPath $sessionLog.FullName -ErrorAction Stop |
                      Where-Object { $_ -match '\[(error|warn)\]|Bootstrapper iniciado|UI Loaded|UI Closed|StartUiThread fatal exception' } |
                      ForEach-Object { Write-Output ($_ -replace '(?i)(resume\s*token\s*[=:]\s*)[^\s,;]+', '$1[REDACTED]') }
                  }
                }

                $fatalLog = Join-Path $env:TEMP 'EvaluaPro-InstallerHub-fatal.log'
                if ((Test-Path -LiteralPath $fatalLog -PathType Leaf) -and (Get-Item -LiteralPath $fatalLog).LastWriteTimeUtc -ge $smokeLaunchedAt) {
                  Write-Output 'SMOKE_BURN_FATAL_LOG:'
                  Get-Content -LiteralPath $fatalLog -Tail 80 -ErrorAction Stop |
                    ForEach-Object { Write-Output ($_ -replace '(?i)(resume\s*token\s*[=:]\s*)[^\s,;]+', '$1[REDACTED]') }
                }
              }
            } catch {
              Write-Output "SMOKE_BURN_DIAGNOSTIC_CAPTURE_FAILURE: $($_.Exception.GetType().FullName): $($_.Exception.Message)"
            }
            throw
          } finally {
            if ($baselineCaptured) {
              if ($proc) {
                try {
                  $proc.Refresh()
                  if (-not $proc.HasExited) { & cmd.exe /c "taskkill.exe /PID $($proc.Id) /T /F >nul 2>&1" }
                } catch {}
              }
              $deadline = (Get-Date).AddSeconds(30)
              do {
                $smokeProcesses = @(Get-ActiveInstallerHubProcess | Where-Object { $_.ProcessId -notin @($preexistingProcesses | ForEach-Object { $_.ProcessId }) })
                foreach ($smokeProcess in $smokeProcesses) {
                  & cmd.exe /c "taskkill.exe /PID $($smokeProcess.ProcessId) /T /F >nul 2>&1"
                }
                if ($smokeProcesses.Count -eq 0) { break }
                Start-Sleep -Milliseconds 500
              } while ((Get-Date) -lt $deadline)
              $remainingProcesses = @(Get-ActiveInstallerHubProcess | Where-Object { $_.ProcessId -notin @($preexistingProcesses | ForEach-Object { $_.ProcessId }) })
              if ($remainingProcesses.Count -gt 0) {
                $details = ($remainingProcesses | ForEach-Object { "{0}:{1} parent={2}" -f $_.Name, $_.ProcessId, $_.ParentProcessId }) -join ', '
                Write-Output "SMOKE_BURN_REMAINING_PROCESSES: $details"
                throw "El smoke dejó procesos Installer Hub activos tras el cierre del árbol: $details"
              }
              # taskkill puede devolver un código distinto de cero si el proceso terminó entre la enumeración y el cierre.
              # La condición real de éxito es que el árbol iniciado por este smoke ya no exista.
              $global:LASTEXITCODE = 0
            }
          }

      - name: Etapa hash/manifest de release instalador
        shell: powershell
        env:
          RELEASE_IS_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/hub-v')) }}
          CANDIDATE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          if ($env:RELEASE_IS_CANDIDATE -eq "true") {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-installer-hashes.ps1 -FlavorId docente-local -CommitSha $env:CANDIDATE_SHA
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-installer-hashes.ps1
          }

      - name: Antivirus gate del Installer Hub
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/run-defender-scan.ps1 -TargetPath 'dist/installer' -ReportPath 'dist/installer/antivirus-scan-report.txt'

      - name: Etapa signing gate
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          EVALUAPRO_RELEASE_FLAVOR: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/hub-v'))) && 'docente-local' || '' }}
          EVALUAPRO_RELEASE_COMMIT: ${{ inputs.source_sha || github.sha }}
          EVALUAPRO_SIGN_CERT_BASE64: ${{ secrets.EVALUAPRO_SIGN_CERT_BASE64 }}
          EVALUAPRO_SIGN_CERT_PASSWORD: ${{ secrets.EVALUAPRO_SIGN_CERT_PASSWORD }}
          EVALUAPRO_SIGN_LOCAL_ONLY: '1'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-installer-artifacts.ps1

      - name: Instalar Chromium para la E2E docente completa
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/hub-v') || github.event_name == 'workflow_dispatch'
        run: npx playwright install chromium

      - name: Instalar Microsoft Edge para validar el PDF en GUI
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/hub-v') || github.event_name == 'workflow_dispatch'
        run: npx playwright install msedge

      - name: Instalar Poppler fijado para renderizar la vista previa PDF
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/hub-v') || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $version = '26.09.0-0'
          $archivePath = Join-Path $env:RUNNER_TEMP "poppler-windows-$version.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "poppler-windows-$version"
          $downloadUri = "https://github.com/oschwartz10612/poppler-windows/releases/download/v$version/Release-$version.zip"
          $expectedSha256 = '7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0'

          Invoke-WebRequest -Uri $downloadUri -OutFile $archivePath
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "El archivo Poppler $version no coincide con el SHA-256 fijado." }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          $pdftoppmMatches = @(Get-ChildItem -LiteralPath $extractPath -Filter 'pdftoppm.exe' -File -Recurse)
          if ($pdftoppmMatches.Count -ne 1) { throw "Se esperaba un pdftoppm.exe en Poppler $version; encontrados: $($pdftoppmMatches.Count)." }

          $pdftoppmPath = $pdftoppmMatches[0].FullName
          $popplerBin = Split-Path -Parent $pdftoppmPath
          $versionStdout = Join-Path $env:RUNNER_TEMP "poppler-version-$version.stdout.txt"
          $versionStderr = Join-Path $env:RUNNER_TEMP "poppler-version-$version.stderr.txt"
          $versionProcess = Start-Process -FilePath $pdftoppmPath -ArgumentList '-v' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $versionStdout -RedirectStandardError $versionStderr
          $versionOutput = @(
            Get-Content -LiteralPath $versionStdout -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $versionStderr -ErrorAction SilentlyContinue
          ) -join [Environment]::NewLine
          if ($versionProcess.ExitCode -ne 0 -or $versionOutput -notmatch 'pdftoppm version') { throw "No se pudo ejecutar el pdftoppm fijado: $versionOutput" }

          Add-Content -LiteralPath $env:GITHUB_PATH -Value $popplerBin
          Write-Host "Poppler $version listo: $versionOutput"

      - name: Determinar si aplica upgrade desde v1.2.3
        id: upgrade_gate
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/hub-v') || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $candidateRaw = (Get-Content -Raw -LiteralPath 'config/hub-version.json' | ConvertFrom-Json).version
          $candidateStable = ([string]$candidateRaw).Split('-')[0]
          $candidateVersion = $null
          if (-not [version]::TryParse($candidateStable, [ref]$candidateVersion)) { throw "Versión candidata inválida: $candidateRaw" }
          $baselineVersion = [version]'1.2.3'
          $required = $candidateVersion -gt $baselineVersion
          "version=$candidateRaw" >> $env:GITHUB_OUTPUT
          "required=$($required.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Upgrade E2E requerido: $required ($baselineVersion -> $candidateRaw)"

      - name: Descargar y verificar baseline oficial v1.2.3 para upgrade E2E
        if: steps.upgrade_gate.outputs.required == 'true'
        shell: powershell
        run: |
          $baselineDir = Join-Path $env:RUNNER_TEMP 'evaluapro-upgrade-baseline-v1.2.3'
          New-Item -ItemType Directory -Path $baselineDir -Force | Out-Null
          $baselineName = 'EvaluaPro-InstallerHub-docente-local-v1.2.3.exe'
          $baselinePath = Join-Path $baselineDir $baselineName
          $baselineUrl = 'https://github.com/Dtcsrni/EvaluaPro_Sistema_Universitario/releases/download/v1.2.3/' + $baselineName
          $expectedHash = '644984c84fc05c4ec1f3804bda9d20666d229f7bab23caeb3a9c767179c82913'
          $downloadScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/download-github-release-asset.ps1'
          & $downloadScript -Uri $baselineUrl -Destination $baselinePath -ExpectedLength 249491600 -ExpectedSha256 $expectedHash
          & $downloadScript -Uri ($baselineUrl + '.sha256') -Destination ($baselinePath + '.sha256') -MaxAttempts 3
          $sidecarText = Get-Content -Raw -LiteralPath ($baselinePath + '.sha256')
          $sidecarMatch = [regex]::Match($sidecarText, '(?i)^\s*([0-9a-f]{64})\s+')
          if (-not $sidecarMatch.Success -or $sidecarMatch.Groups[1].Value.ToLowerInvariant() -ne $expectedHash) {
            throw 'El sidecar oficial de EvaluaPro v1.2.3 no coincide con el SHA-256 fijado.'
          }
          $actualHash = (Get-FileHash -LiteralPath $baselinePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'El bundle oficial v1.2.3 descargado no coincide con su SHA-256.' }
          "BASELINE_BUNDLE_PATH=$baselinePath" >> $env:GITHUB_ENV
          Write-Host "Baseline oficial v1.2.3 verificado: $actualHash"

      - name: Preparar ruta privada para evidencia E2E
        id: preparar_reporte_e2e
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/hub-v') || github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          INSTALLER_CI_RUN_ID: ${{ github.run_id }}
          INSTALLER_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ($env:INSTALLER_CI_RUN_ID -notmatch '^[0-9]+$' -or $env:INSTALLER_CI_RUN_ATTEMPT -notmatch '^[0-9]+$') { throw 'Identificadores de ejecución inválidos.' }
          if ([string]::IsNullOrWhiteSpace($env:USERPROFILE)) { throw 'El runner no expuso su perfil de usuario.' }
          $reportDir = Join-Path $env:USERPROFILE ('installer-hub-e2e-docente-ci-' + $env:INSTALLER_CI_RUN_ID + '-' + $env:INSTALLER_CI_RUN_ATTEMPT)
          "report_dir=$reportDir" >> $env:GITHUB_OUTPUT

      - name: E2E completa sobre el bundle docente que se publicará
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/hub-v') || github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          EVALUAPRO_INSTALLER_SIMULATE_WSL_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_SIMULATE_AUTO_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_AUTO_BOOTSTRAP_WSL: '1'
          EVALUAPRO_LICENSE_ACTIVATION_SIMULATE: '1'
          INSTALLER_CI_RUN_ID: ${{ github.run_id }}
          E2E_REPORT_DIR: ${{ steps.preparar_reporte_e2e.outputs.report_dir }}
        run: |
          if ($env:INSTALLER_CI_RUN_ID -notmatch '^[0-9]+$') { throw "GitHub run ID inválido." }
          $runnerArgs = @(
            '-RootPath', $env:GITHUB_WORKSPACE,
            '-ReleaseManifestPath', (Join-Path $env:GITHUB_WORKSPACE 'dist\installer\EvaluaPro-release-manifest.json'),
            '-ReportDir', $env:E2E_REPORT_DIR,
            '-InstallDir', (Join-Path $env:LOCALAPPDATA 'EvaluaPro-QA-Isolated-installer-hub-e2e'),
            '-Port', '4519',
            '-IUnderstandThisMutatesPc',
            '-SeedDummyData'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:BASELINE_BUNDLE_PATH)) {
            $runnerArgs += @('-BaselineBundlePath', $env:BASELINE_BUNDLE_PATH)
          }
          if ([string]::IsNullOrWhiteSpace($env:SAME_VERSION_RELATED_BUNDLE_PATH)) { throw 'Falta el fixture Burn relacionado de la misma versión.' }
          $runnerArgs += @('-SameVersionRelatedBundlePath', $env:SAME_VERSION_RELATED_BUNDLE_PATH)
          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_VERSION_RELATED_BUNDLE_PATH)) { throw 'Falta el fixture Burn relacionado de versión previa.' }
          $runnerArgs += @('-PreviousVersionRelatedBundlePath', $env:PREVIOUS_VERSION_RELATED_BUNDLE_PATH)
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/installer-hub-e2e-docente.ps1 @runnerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: E2E visual de vista y descarga PDF en Edge
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/hub-v') || github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          E2E_REPORT_DIR: ${{ steps.preparar_reporte_e2e.outputs.report_dir }}
          E2E_BROWSER_CHANNEL: msedge
        run: npx playwright test -c tests/gui-responsive/playwright.pdf-edge.config.mjs

      - name: Publicar evidencia de la E2E completa
        if: always() && steps.preparar_reporte_e2e.outputs.report_dir != '' && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/hub-v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-hub-e2e-${{ github.run_id }}
          path: ${{ steps.preparar_reporte_e2e.outputs.report_dir }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Verificar artefactos
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $docExeList = @(Get-ChildItem -LiteralPath 'dist/installer/docente-local' -Filter 'EvaluaPro-InstallerHub-docente-local-v*.exe' -File)
          if ($docExeList.Count -eq 0) { throw "No existe bundle docente-local" }
          if (-not (Test-Path ($docExeList[0].FullName + '.sha256'))) { throw "No existe hash del bundle docente-local" }
          if (-not (Test-Path 'dist/installer/EvaluaPro-release-manifest.json')) { throw 'No existe manifiesto de release' }
          if (-not (Test-Path 'dist/installer/_internal/docente-local/EvaluaPro-docente-local.msi')) { throw 'No existe MSI docente-local' }

      - name: Verificar artefactos de release
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $docExeList = @(Get-ChildItem -LiteralPath 'dist/installer/docente-local' -Filter 'EvaluaPro-InstallerHub-docente-local-v*.exe' -File | Sort-Object LastWriteTime -Descending)
          if ($docExeList.Count -eq 0) { throw "No existe dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe" }
          $docExe = $docExeList[0]
          # Eliminar versiones viejas residuales
          for ($i = 1; $i -lt $docExeList.Count; $i++) {
              Write-Host "Limpiando version antigua: $($docExeList[$i].FullName)"
              Remove-Item -Path $docExeList[$i].FullName -Force
              if (Test-Path ($docExeList[$i].FullName + '.sha256')) { Remove-Item -Path ($docExeList[$i].FullName + '.sha256') -Force }
          }
          
          if (-not (Test-Path ($docExe.FullName + '.sha256'))) { throw "No existe hash para $($docExe.Name)" }
          if (Test-Path "dist/installer/EvaluaPro-InstallerHub-docente-local.exe") { throw "No debe existir nombre legacy sin version: dist/installer/EvaluaPro-InstallerHub-docente-local.exe" }
          if (-not (Test-Path "dist/installer/EvaluaPro-release-manifest.json")) { throw "No existe dist/installer/EvaluaPro-release-manifest.json" }
          if (-not (Test-Path "dist/installer/antivirus-scan-report.txt")) { throw "No existe dist/installer/antivirus-scan-report.txt" }
          foreach ($required in @('dist/installer/EvaluaPro-CodeSigning-Certificate.cer', 'dist/installer/EvaluaPro-CodeSigning-Certificate.cer.sha256', 'dist/installer/FIRMA-LEEME.md')) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Falta material de confianza manual: $required" }
          }
          if (-not (Test-Path "dist/installer/_internal/docente-local/EvaluaPro-docente-local.msi")) { throw "No existe dist/installer/_internal/docente-local/EvaluaPro-docente-local.msi" }
          if (Test-Path "dist/installer/EvaluaPro-docente-local.msi") { throw "MSI tecnico no debe quedar en raiz publica: dist/installer/EvaluaPro-docente-local.msi" }

      - name: Calcular digest del bundle candidato validado
        id: candidate_digest
        shell: powershell
        run: |
          $bundles = @(Get-ChildItem -LiteralPath 'dist/installer/docente-local' -Filter 'EvaluaPro-InstallerHub-docente-local-v*.exe' -File)
          if ($bundles.Count -ne 1) { throw "Se esperaba un bundle docente-local, encontrados: $($bundles.Count)." }
          $hash = (Get-FileHash -LiteralPath $bundles[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw 'No se pudo calcular un SHA-256 válido para el bundle.' }
          "bundle_sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publicar artefactos instalador
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-windows
          path: |
            dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe
            dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe.sha256
            dist/installer/antivirus-scan-report.txt
            dist/installer/EvaluaPro-release-manifest.json
            dist/installer/EvaluaPro-CodeSigning-Certificate.cer
            dist/installer/EvaluaPro-CodeSigning-Certificate.cer.sha256
            dist/installer/FIRMA-LEEME.md
            dist/installer/SIGNING-NOT-PRODUCTION.txt
          retention-days: 90

      - name: Publicar artefactos internos instalador
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-windows-internal
          path: |
            dist/installer/_internal/**

      - name: Limpiar confianza temporal de firma en runner
        if: ${{ always() && env.EVALUAPRO_TEMP_TRUST_THUMBPRINT != '' }}
        shell: powershell
        run: |
          $thumbprint = $env:EVALUAPRO_TEMP_TRUST_THUMBPRINT
          $storeManager = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/manage-temporary-root-certificate.ps1'
          & $storeManager -Action Remove -Thumbprint $thumbprint -TimeoutSeconds 45

  reuse_installer_candidate:
    name: Reutilizar bundle y E2E verificados
    needs: detectar_cambios
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      bundle_sha256: ${{ steps.verify_candidate.outputs.bundle_sha256 }}
    steps:
      - name: Descargar código para validar el candidato
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validar fuente, allowlist y evidencia E2E previa
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'source_sha debe ser SHA completo.' >&2; exit 1; }
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'candidate_run_id debe ser numérico.' >&2; exit 1; }
          SOURCE_SHA="$(printf '%s' "$SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"
          MAIN_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SOURCE_SHA" "$MAIN_SHA" || { echo 'El SHA candidato no es ancestro de main.' >&2; exit 1; }
          CANDIDATE_VERSION="$(git show "$SOURCE_SHA:config/hub-version.json" | jq -r '.version')"
          MAIN_VERSION="$(node -p "require('./config/hub-version.json').version")"
          [[ "$CANDIDATE_VERSION" == "$MAIN_VERSION" ]] || { echo 'La versión candidata difiere de main.' >&2; exit 1; }
          [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" == "hub-v$CANDIDATE_VERSION" ]] || { echo 'release_tag no coincide con la versión candidata.' >&2; exit 1; }
          EVIDENCE_PREFIX="docs/release/evidencias/$CANDIDATE_VERSION/"
          ALLOWED_RELEASE_CONTROL_PATHS=(
            '.github/workflows/ci-installer-windows.yml'
            '.github/workflows/release-stable-gate.yml'
            'scripts/tests/ci-workflow-contract.test.mjs'
            'scripts/tests/installer-upgrade-e2e-contract.test.mjs'
            'docs/specs/SPEC-122_estabilizacion_release_1_2_8.spec.md'
          )
          while IFS= read -r changed_path; do
            [[ -z "$changed_path" ]] && continue
            allowed=false
            if [[ "$changed_path" == "$EVIDENCE_PREFIX"* ]]; then
              allowed=true
            else
              for allowed_path in "${ALLOWED_RELEASE_CONTROL_PATHS[@]}"; do
                [[ "$changed_path" == "$allowed_path" ]] && allowed=true && break
              done
            fi
            [[ "$allowed" == true ]] || { echo "Drift no permitido después del candidato: $changed_path" >&2; exit 1; }
          done < <(git diff --name-only "$SOURCE_SHA..$MAIN_SHA")
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          CANDIDATE_IS_MAIN="$(jq -r --arg sha "$SOURCE_SHA" '.name == "CI Installer Windows" and .event == "workflow_dispatch" and .head_branch == "main" and (.head_sha | ascii_downcase) == $sha' <<<"$RUN")"
          CANDIDATE_IS_RELEASE_TAG="$(jq -r --arg sha "$SOURCE_SHA" --arg tag "$RELEASE_TAG" '.name == "CI Installer Windows" and .event == "push" and .head_branch == $tag and (.head_sha | ascii_downcase) == $sha' <<<"$RUN")"
          [[ "$CANDIDATE_IS_MAIN" == true || ( "$RELEASE_TAG" != '' && "$CANDIDATE_IS_RELEASE_TAG" == true ) ]] || {
            echo 'El run candidato debe ser una E2E validada en main o en su tag Hub correspondiente y usar el mismo SHA.' >&2; exit 1;
          }
          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/jobs?per_page=100")"
          BUILD_JOB="$(jq -c '[.jobs[] | select(.name == "Installer Windows Build (MSI + Bundle)")] | if length == 1 then .[0] else empty end' <<<"$JOBS")"
          [[ -n "$BUILD_JOB" ]] || { echo 'No existe un único job de build candidato.' >&2; exit 1; }
          [[ "$(jq -r '.conclusion' <<<"$BUILD_JOB")" == success ]] || { echo 'El job que contiene build y E2E previas no concluyó success.' >&2; exit 1; }
          for required_step in 'E2E completa sobre el bundle docente que se publicará' 'E2E visual de vista y descarga PDF en Edge' 'Publicar evidencia de la E2E completa'; do
            jq -e --arg name "$required_step" '.steps[] | select(.name == $name and .conclusion == "success")' <<<"$BUILD_JOB" >/dev/null || {
              echo "Falta evidencia E2E exitosa del paso: $required_step" >&2; exit 1;
            }
          done
          echo "Run candidato verificado: $CANDIDATE_RUN_ID ($SOURCE_SHA), con E2E de instalador y PDF aprobadas." >> "$GITHUB_STEP_SUMMARY"

      - name: Descargar artefacto del run candidato validado
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: installer-windows
          path: dist/installer
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Validar manifiesto y digest del candidato reutilizado
        id: verify_candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_VERSION="$(node -p "require('./config/hub-version.json').version")"
          test -s dist/installer/EvaluaPro-release-manifest.json
          TARGET_VERSION="$TARGET_VERSION" SOURCE_SHA="$SOURCE_SHA" node scripts/release/installer-release-manifest.mjs --manifest=dist/installer/EvaluaPro-release-manifest.json
          bundle="$(find dist/installer/docente-local -maxdepth 1 -type f -name 'EvaluaPro-InstallerHub-docente-local-v*.exe' -print -quit)"
          test -n "$bundle"
          bundle_count="$(find dist/installer/docente-local -maxdepth 1 -type f -name 'EvaluaPro-InstallerHub-docente-local-v*.exe' | wc -l)"
          [[ "$bundle_count" == 1 ]] || { echo "Se esperaba un solo bundle; encontrados: $bundle_count" >&2; exit 1; }
          test -s "$bundle.sha256"
          test -s dist/installer/antivirus-scan-report.txt
          jq -e '.flavors | length == 1 and .[0].flavorId == "docente-local"' dist/installer/EvaluaPro-release-manifest.json >/dev/null || { echo 'El manifiesto no describe un único flavor docente-local.' >&2; exit 1; }
          bundle_sha256="$(sha256sum "$bundle" | awk '{print tolower($1)}')"
          sidecar_sha256="$(awk 'NR == 1 {print tolower($1)}' "$bundle.sha256")"
          [[ "$sidecar_sha256" =~ ^[0-9a-f]{64}$ && "$sidecar_sha256" == "$bundle_sha256" ]] || { echo 'El sidecar no coincide con el bundle reutilizado.' >&2; exit 1; }
          echo "bundle_sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"
          echo "Bundle reutilizado con digest verificado: $bundle_sha256" >> "$GITHUB_STEP_SUMMARY"

  installer_windows:
    name: Installer Windows (MSI + Bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detectar_cambios, installer_windows_build, reuse_installer_candidate]
    if: always()
    steps:
      - name: Validar resultado del build o aceptar PR sin payload afectado
        shell: bash
        env:
          DETECTOR_RESULT: ${{ needs.detectar_cambios.result }}
          RUN_INSTALLER: ${{ needs.detectar_cambios.outputs.run_installer }}
          BUILD_RESULT: ${{ needs.installer_windows_build.result }}
          REUSE_RESULT: ${{ needs.reuse_installer_candidate.result }}
        run: |
          set -euo pipefail
          if [[ "$DETECTOR_RESULT" != "success" ]]; then
            echo "No se pudo determinar si el payload del instalador cambió." >&2
            exit 1
          fi
          if [[ "$REUSE_RESULT" == "success" ]]; then
            echo "Bundle reutilizado desde un run previamente validado por SHA y digest."
            exit 0
          fi
          if [[ "$RUN_INSTALLER" != "true" ]]; then
            echo "Sin cambios de payload: build MSI/Bundle omitido."
            if [[ "$BUILD_RESULT" != "skipped" ]]; then
              echo "Resultado inesperado del build: $BUILD_RESULT" >&2
              exit 1
            fi
            exit 0
          fi
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "El build MSI/Bundle terminó: $BUILD_RESULT" >&2
            exit 1
          fi
          echo "Build MSI/Bundle aprobado."

  publish_installer_release:
    name: Publicar release del instalador
    needs: [installer_windows_build, reuse_installer_candidate]
    if: ${{ always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/hub-v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && (needs.installer_windows_build.result == 'success' || needs.reuse_installer_candidate.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    outputs:
      release_id: ${{ steps.publish_release.outputs.id }}

    steps:
      - name: Descargar código para validar el release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Descargar artefactos del build validado
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: installer-windows
          path: dist/installer
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verificar assets de publicación
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe)
          if (( ${#installers[@]} != 1 )); then
            echo "Se esperaba exactamente un bundle docente-local; encontrados: ${#installers[@]}" >&2
            exit 1
          fi
          test -f "${installers[0]}.sha256"
          test -f dist/installer/EvaluaPro-release-manifest.json
          test -f dist/installer/antivirus-scan-report.txt

      - name: Preparar release como borrador hasta validar el asset descargado
        id: publish_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ inputs.source_sha || github.sha }}
          draft: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, 'alpha') || contains(inputs.release_tag || github.ref_name, 'beta') || contains(inputs.release_tag || github.ref_name, 'rc') }}
          make_latest: false
          overwrite_files: true
          files: |
            dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe
            dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe.sha256
            dist/installer/EvaluaPro-release-manifest.json
            dist/installer/EvaluaPro-CodeSigning-Certificate.cer
            dist/installer/EvaluaPro-CodeSigning-Certificate.cer.sha256
            dist/installer/FIRMA-LEEME.md
            dist/installer/antivirus-scan-report.txt

      - name: Verificar assets candidato y fijar target del borrador
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.publish_release.outputs.id }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo 'ID de release inválido.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'SOURCE_SHA debe ser un SHA completo.' >&2; exit 1; }
          VERSION="${RELEASE_TAG#hub-v}"
          [[ "$RELEASE_TAG" == "hub-v$VERSION" ]] || { echo 'La tag no tiene formato hub-vX.Y.Z.' >&2; exit 1; }
          manifest="dist/installer/EvaluaPro-release-manifest.json"
          exe="dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v$VERSION.exe"
          sidecar="$exe.sha256"
          test -s "$manifest" && test -s "$exe" && test -s "$sidecar"
          TARGET_VERSION="$VERSION" SOURCE_SHA="${SOURCE_SHA,,}" node scripts/release/installer-release-manifest.mjs "--manifest=$manifest"
          exe_hash="$(sha256sum "$exe" | awk '{print tolower($1)}')"
          manifest_hash="$(sha256sum "$manifest" | awk '{print tolower($1)}')"
          sidecar_hash="$(awk 'NR == 1 {print tolower($1)}' "$sidecar")"
          [[ "$sidecar_hash" =~ ^[0-9a-f]{64}$ && "$sidecar_hash" == "$exe_hash" ]] || { echo 'Sidecar local no coincide con el bundle candidato.' >&2; exit 1; }
          tag_preexisting=false
          if tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null)"; then
            tag_object_type="$(jq -r '.object.type' <<<"$tag_ref")"
            tag_object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            while [[ "$tag_object_type" == tag ]]; do
              tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
              tag_object_type="$(jq -r '.object.type' <<<"$tag_object")"
              tag_object_sha="$(jq -r '.object.sha' <<<"$tag_object")"
            done
            [[ "$tag_object_type" == commit && "${tag_object_sha,,}" == "${SOURCE_SHA,,}" ]] || {
              echo "La tag $RELEASE_TAG ya existe y no apunta al SHA candidato; no se retargetea." >&2; exit 1;
            }
            tag_preexisting=true
          else
            api_status="$(gh api --include "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null | head -n 1 || true)"
            [[ "$api_status" =~ ^HTTP/[0-9.]+[[:space:]]404[[:space:]] ]] || { echo "No se pudo confirmar la ausencia de $RELEASE_TAG; no se crea ni retargetea la tag." >&2; exit 1; }
          fi
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == true and .prerelease == false and .published_at == null' <<<"$release_json" >/dev/null || {
            echo 'El release no es el borrador estable esperado y no publicado.' >&2; exit 1;
          }
          check_asset() {
            local name="$1" digest="$2" bytes="$3"
            local remote_digest remote_bytes count
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
            [[ "$count" == 1 ]] || { echo "Se esperaba exactamente un asset $name; encontrados: $count" >&2; exit 1; }
            remote_digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // empty' <<<"$release_json")"
            remote_bytes="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' <<<"$release_json")"
            [[ "$remote_digest" == "sha256:$digest" && "$remote_bytes" == "$bytes" ]] || {
              echo "El asset remoto $name no coincide en SHA-256 o longitud." >&2; exit 1;
            }
          }
          check_asset "$(basename "$exe")" "$exe_hash" "$(stat -c '%s' "$exe")"
          check_asset "$(basename "$sidecar")" "$(sha256sum "$sidecar" | awk '{print tolower($1)}')" "$(stat -c '%s' "$sidecar")"
          check_asset "$(basename "$manifest")" "$manifest_hash" "$(stat -c '%s' "$manifest")"
          for trust_asset in dist/installer/EvaluaPro-CodeSigning-Certificate.cer dist/installer/EvaluaPro-CodeSigning-Certificate.cer.sha256 dist/installer/FIRMA-LEEME.md; do
            test -s "$trust_asset" || { echo "Falta el asset de confianza manual: $trust_asset" >&2; exit 1; }
            trust_hash="$(sha256sum "$trust_asset" | awk '{print tolower($1)}')"
            check_asset "$(basename "$trust_asset")" "$trust_hash" "$(stat -c '%s' "$trust_asset")"
          done
          if [[ "$tag_preexisting" == true ]]; then
            jq -e --arg tag "$RELEASE_TAG" --arg sha "${SOURCE_SHA,,}" '(.tag_name == $tag) and ((.target_commitish | ascii_downcase) == $sha)' <<<"$release_json" >/dev/null || {
              echo 'El borrador no coincide con la tag existente y el SHA candidato; no se retargetea.' >&2; exit 1;
            }
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f "tag_name=$RELEASE_TAG" -f "target_commitish=${SOURCE_SHA,,}" >/dev/null
          fi
          verified_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "${SOURCE_SHA,,}" '.tag_name == $tag and .target_commitish == $sha and .draft == true and .prerelease == false and .published_at == null' <<<"$verified_release" >/dev/null || {
            echo 'El borrador no quedó fijado al SHA candidato después de reconsultarlo.' >&2; exit 1;
          }
          release_json="$verified_release"
          check_asset "$(basename "$exe")" "$exe_hash" "$(stat -c '%s' "$exe")"
          check_asset "$(basename "$sidecar")" "$(sha256sum "$sidecar" | awk '{print tolower($1)}')" "$(stat -c '%s' "$sidecar")"
          check_asset "$(basename "$manifest")" "$manifest_hash" "$(stat -c '%s' "$manifest")"
          for trust_asset in dist/installer/EvaluaPro-CodeSigning-Certificate.cer dist/installer/EvaluaPro-CodeSigning-Certificate.cer.sha256 dist/installer/FIRMA-LEEME.md; do
            test -s "$trust_asset" || { echo "Falta el asset de confianza manual: $trust_asset" >&2; exit 1; }
            trust_hash="$(sha256sum "$trust_asset" | awk '{print tolower($1)}')"
            check_asset "$(basename "$trust_asset")" "$trust_hash" "$(stat -c '%s' "$trust_asset")"
          done
          echo "Borrador verificado y fijado: $RELEASE_TAG -> ${SOURCE_SHA,,}; assets candidatos coinciden."

  post_publish_installer_e2e:
    name: E2E del asset descargado desde el release draft
    needs: [installer_windows, publish_installer_release, reuse_installer_candidate, installer_windows_build]
    outputs:
      draft_sha256: ${{ steps.draft_asset.outputs.sha256 }}
    if: ${{ always() && !cancelled() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/hub-v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && needs.publish_installer_release.result == 'success' && needs.installer_windows.result == 'success' && (needs.reuse_installer_candidate.result == 'success' || needs.installer_windows_build.result == 'success') }}
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      # GitHub solo expone drafts a tokens con acceso push; el token se limita al paso de descarga.
      contents: write

    steps:
      - name: Descargar código de la tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Configurar .NET SDK 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar WiX CLI estable para la E2E
        shell: powershell
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7
          $dotnetToolsDir = Join-Path $env:USERPROFILE ".dotnet\tools"
          if (-not (Test-Path $dotnetToolsDir)) { throw "No se encontró la carpeta de herramientas .NET global ($dotnetToolsDir)." }
          "$dotnetToolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wixPath = Join-Path $dotnetToolsDir "wix.exe"
          if (-not (Test-Path $wixPath)) { throw "No se encontró wix.exe en la carpeta de herramientas .NET global ($dotnetToolsDir)." }
          $wixVersion = (& $wixPath --version | Select-Object -First 1)
          if ($wixVersion -notmatch '^7\.0\.\d+(?:[+\-].*)?$') { throw "Versión WiX no permitida: $wixVersion. Se requiere 7.0.x." }

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Instalar dependencias de la E2E
        shell: powershell
        run: |
          npm install --global npm@12.2.1
          npm ci --foreground-scripts
          npx prisma generate --config=apps/backend/prisma.config.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Descargar y verificar EXE y sidecar desde el release draft
        id: draft_asset
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_ID: ${{ needs.publish_installer_release.outputs.release_id }}
          CANDIDATE_SHA256: ${{ needs.reuse_installer_candidate.outputs.bundle_sha256 || needs.installer_windows_build.outputs.bundle_sha256 }}
        run: |
          $repository = $env:RELEASE_REPOSITORY
          $tag = $env:RELEASE_TAG
          $releaseId = $env:RELEASE_ID
          if ($repository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Repositorio inválido.' }
          if ($tag -notmatch '^hub-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$') { throw 'Tag de release inválida.' }
          if ($releaseId -notmatch '^[0-9]+$') { throw 'ID del release draft inválido.' }
          $packageVersion = [string](Get-Content -Raw -LiteralPath 'config/hub-version.json' | ConvertFrom-Json).version
          if ("hub-v$packageVersion" -ne $tag) { throw "La versión del Hub ($packageVersion) no coincide con la tag ($tag)." }
          $release = gh api "repos/$repository/releases/$releaseId" | ConvertFrom-Json
          if ([string]$release.id -ne $releaseId -or $release.tag_name -ne $tag -or -not $release.draft) {
            throw "El release $releaseId no es el borrador esperado para $tag."
          }
          $candidateName = "EvaluaPro-InstallerHub-docente-local-v$packageVersion.exe"
          $candidateAsset = @($release.assets | Where-Object { $_.name -eq $candidateName }) | Select-Object -First 1
          $sidecarAsset = @($release.assets | Where-Object { $_.name -eq ($candidateName + '.sha256') }) | Select-Object -First 1
          $manifestAsset = @($release.assets | Where-Object { $_.name -eq 'EvaluaPro-release-manifest.json' }) | Select-Object -First 1
          $certificateAsset = @($release.assets | Where-Object { $_.name -eq 'EvaluaPro-CodeSigning-Certificate.cer' }) | Select-Object -First 1
          $certificateShaAsset = @($release.assets | Where-Object { $_.name -eq 'EvaluaPro-CodeSigning-Certificate.cer.sha256' }) | Select-Object -First 1
          $trustGuideAsset = @($release.assets | Where-Object { $_.name -eq 'FIRMA-LEEME.md' }) | Select-Object -First 1
          if (-not $candidateAsset -or -not $sidecarAsset -or -not $manifestAsset -or -not $certificateAsset -or -not $certificateShaAsset -or -not $trustGuideAsset) {
            throw "El release draft no contiene el EXE, sidecar, manifiesto y material de confianza manual esperado para $tag."
          }
          $assetDigest = [string]$candidateAsset.digest
          $digestMatch = [regex]::Match($assetDigest, '(?i)^sha256:([0-9a-f]{64})$')
          if (-not $digestMatch.Success) { throw "La API de GitHub no reportó digest SHA-256 válido para ${candidateName}: '$assetDigest'." }
          $downloadDir = Join-Path $env:RUNNER_TEMP ('published-installer-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          $candidatePath = Join-Path $downloadDir $candidateName
          $sidecarPath = $candidatePath + '.sha256'
          $releaseManifestPath = Join-Path $env:GITHUB_WORKSPACE 'dist\installer\EvaluaPro-release-manifest.json'
          $manifestDigest = [regex]::Match([string]$manifestAsset.digest, '(?i)^sha256:([0-9a-f]{64})$')
          $certificateDigest = [regex]::Match([string]$certificateAsset.digest, '(?i)^sha256:([0-9a-f]{64})$')
          $certificateShaDigest = [regex]::Match([string]$certificateShaAsset.digest, '(?i)^sha256:([0-9a-f]{64})$')
          $trustGuideDigest = [regex]::Match([string]$trustGuideAsset.digest, '(?i)^sha256:([0-9a-f]{64})$')
          if (-not $manifestDigest.Success -or -not $certificateDigest.Success -or -not $certificateShaDigest.Success -or -not $trustGuideDigest.Success) {
            throw 'La API de GitHub no reportó digest SHA-256 válido para alguno de los assets de release.'
          }
          New-Item -ItemType Directory -Path (Split-Path -Parent $releaseManifestPath) -Force | Out-Null
          $certificatePath = Join-Path $downloadDir 'EvaluaPro-CodeSigning-Certificate.cer'
          $certificateShaPath = $certificatePath + '.sha256'
          $trustGuidePath = Join-Path $downloadDir 'FIRMA-LEEME.md'
          $downloadScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/download-github-release-asset.ps1'
          & $downloadScript -Uri ([uri][string]$candidateAsset.url) -Destination $candidatePath -ExpectedLength ([long]$candidateAsset.size) -ExpectedSha256 $digestMatch.Groups[1].Value -GitHubApiAsset
          & $downloadScript -Uri ([uri][string]$sidecarAsset.url) -Destination $sidecarPath -ExpectedLength ([long]$sidecarAsset.size) -GitHubApiAsset
          & $downloadScript -Uri ([uri][string]$manifestAsset.url) -Destination $releaseManifestPath -ExpectedLength ([long]$manifestAsset.size) -ExpectedSha256 $manifestDigest.Groups[1].Value -GitHubApiAsset
          & $downloadScript -Uri ([uri][string]$certificateAsset.url) -Destination $certificatePath -ExpectedLength ([long]$certificateAsset.size) -ExpectedSha256 $certificateDigest.Groups[1].Value -GitHubApiAsset
          & $downloadScript -Uri ([uri][string]$certificateShaAsset.url) -Destination $certificateShaPath -ExpectedLength ([long]$certificateShaAsset.size) -ExpectedSha256 $certificateShaDigest.Groups[1].Value -GitHubApiAsset
          & $downloadScript -Uri ([uri][string]$trustGuideAsset.url) -Destination $trustGuidePath -ExpectedLength ([long]$trustGuideAsset.size) -ExpectedSha256 $trustGuideDigest.Groups[1].Value -GitHubApiAsset
          $certificateSidecar = [regex]::Match((Get-Content -Raw -LiteralPath $certificateShaPath), '(?i)^\s*([0-9a-f]{64})\s+')
          if (-not $certificateSidecar.Success -or $certificateSidecar.Groups[1].Value.ToLowerInvariant() -ne $certificateDigest.Groups[1].Value.ToLowerInvariant()) {
            throw 'El sidecar del certificado no coincide con el digest publicado.'
          }
          $trustHelper = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/trust-release-signing-certificate.ps1'
          & $trustHelper -TargetPath $candidatePath -CertificatePath $certificatePath -ExpectedCertificateSha256 $certificateDigest.Groups[1].Value
          $releaseManifest = Get-Content -Raw -LiteralPath $releaseManifestPath | ConvertFrom-Json
          if ([string]$releaseManifest.version -ne $packageVersion -or
              [string]$releaseManifest.hubVersion -ne $packageVersion -or
              [string]$releaseManifest.appVersion -ne [string](Get-Content -Raw -LiteralPath 'config/app-version.json' | ConvertFrom-Json).version -or
              [string]$releaseManifest.build.version -ne $packageVersion -or
              [string]$releaseManifest.build.commit -ne [string]$release.target_commitish -or
              @($releaseManifest.flavors).Count -ne 1 -or
              [string]$releaseManifest.flavors[0].flavorId -ne 'docente-local') {
            throw 'El manifiesto descargado no corresponde a la versión, SHA y flavor del release draft.'
          }
          $sidecarText = Get-Content -Raw -LiteralPath $sidecarPath
          $sidecarMatch = [regex]::Match($sidecarText, '(?i)^\s*([0-9a-f]{64})\s+')
          if (-not $sidecarMatch.Success) { throw 'El sidecar SHA-256 publicado no tiene el formato esperado.' }
          $sidecarHash = $sidecarMatch.Groups[1].Value.ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $apiHash = $digestMatch.Groups[1].Value.ToLowerInvariant()
          if ($sidecarHash -ne $actualHash) { throw 'El SHA-256 del EXE descargado no coincide con el sidecar publicado.' }
          if ($apiHash -ne $actualHash) { throw 'SHA-256 del EXE no coincide con el digest de GitHub.' }
          $runE2E = 'true'
          if (-not [string]::IsNullOrWhiteSpace($env:CANDIDATE_SHA256)) {
            if ($env:CANDIDATE_SHA256 -notmatch '^(?i)[0-9a-f]{64}$') { throw 'El digest candidato no es válido.' }
            if ($actualHash -eq $env:CANDIDATE_SHA256.ToLowerInvariant()) { $runE2E = 'false' }
          }
          "sha256=$actualHash" >> $env:GITHUB_OUTPUT
          "run_e2e=$runE2E" >> $env:GITHUB_OUTPUT
          "certificate_path=$certificatePath" >> $env:GITHUB_OUTPUT
          "candidate_path=$candidatePath" >> $env:GITHUB_OUTPUT
          "release_id=$($release.id)" >> $env:GITHUB_OUTPUT
          Write-Host "EXE publicado verificado; tag=$tag; bytes=$((Get-Item -LiteralPath $candidatePath).Length); sha256=$actualHash"

      - name: Descargar y verificar baseline oficial v1.2.3
        if: steps.draft_asset.outputs.run_e2e == 'true'
        shell: powershell
        env:
          BASELINE_BUNDLE_NAME: EvaluaPro-InstallerHub-docente-local-v1.2.3.exe
        run: |
          $baselineDir = Join-Path $env:RUNNER_TEMP 'evaluapro-upgrade-baseline-v1.2.3'
          New-Item -ItemType Directory -Path $baselineDir -Force | Out-Null
          $baselinePath = Join-Path $baselineDir $env:BASELINE_BUNDLE_NAME
          $baselineUrl = 'https://github.com/Dtcsrni/EvaluaPro_Sistema_Universitario/releases/download/v1.2.3/' + $env:BASELINE_BUNDLE_NAME
          $expectedHash = '644984c84fc05c4ec1f3804bda9d20666d229f7bab23caeb3a9c767179c82913'
          $downloadScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/download-github-release-asset.ps1'
          & $downloadScript -Uri $baselineUrl -Destination $baselinePath -ExpectedLength 249491600 -ExpectedSha256 $expectedHash
          & $downloadScript -Uri ($baselineUrl + '.sha256') -Destination ($baselinePath + '.sha256') -MaxAttempts 3
          $sidecar = [regex]::Match((Get-Content -Raw -LiteralPath ($baselinePath + '.sha256')), '(?i)^\s*([0-9a-f]{64})\s+')
          $actualHash = (Get-FileHash -LiteralPath $baselinePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $sidecar.Success -or $sidecar.Groups[1].Value.ToLowerInvariant() -ne $expectedHash -or $actualHash -ne $expectedHash) {
            throw 'El baseline oficial v1.2.3 no coincide con el SHA-256 fijado.'
          }
          "BASELINE_BUNDLE_PATH=$baselinePath" >> $env:GITHUB_ENV

      - name: Compilar fixture Burn para el asset del release draft
        if: steps.draft_asset.outputs.run_e2e == 'true'
        shell: powershell
        env:
          CANDIDATE_BUNDLE_PATH: ${{ steps.draft_asset.outputs.candidate_path }}
        run: |
          $fixtureOutput = Join-Path $env:RUNNER_TEMP 'EvaluaPro-QA-SameVersionRelatedBundle.exe'
          & scripts/tests/build-same-version-related-bundle-fixture.ps1 -CandidateBundlePath $env:CANDIDATE_BUNDLE_PATH -OutputPath $fixtureOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previousFixtureOutput = Join-Path $env:RUNNER_TEMP 'EvaluaPro-QA-PreviousVersionRelatedBundle.exe'
          & scripts/tests/build-same-version-related-bundle-fixture.ps1 -CandidateBundlePath $env:CANDIDATE_BUNDLE_PATH -OutputPath $previousFixtureOutput -FixtureVersion '1.2.0.0' -EnvironmentVariableName 'PREVIOUS_VERSION_RELATED_BUNDLE_PATH'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preparar ruta privada para evidencia E2E del borrador
        if: steps.draft_asset.outputs.run_e2e == 'true'
        id: preparar_reporte_e2e
        shell: powershell
        env:
          INSTALLER_CI_RUN_ID: ${{ github.run_id }}
          INSTALLER_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ($env:INSTALLER_CI_RUN_ID -notmatch '^[0-9]+$' -or $env:INSTALLER_CI_RUN_ATTEMPT -notmatch '^[0-9]+$') { throw 'Identificadores de ejecución inválidos.' }
          if ([string]::IsNullOrWhiteSpace($env:USERPROFILE)) { throw 'El runner no expuso su perfil de usuario.' }
          $reportDir = Join-Path $env:USERPROFILE ('installer-hub-e2e-published-ci-' + $env:INSTALLER_CI_RUN_ID + '-' + $env:INSTALLER_CI_RUN_ATTEMPT)
          "report_dir=$reportDir" >> $env:GITHUB_OUTPUT

      - name: E2E completa con el EXE descargado del release
        if: steps.draft_asset.outputs.run_e2e == 'true'
        shell: powershell
        env:
          EVALUAPRO_INSTALLER_SIMULATE_WSL_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_SIMULATE_AUTO_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_AUTO_BOOTSTRAP_WSL: '1'
          EVALUAPRO_LICENSE_ACTIVATION_SIMULATE: '1'
          CANDIDATE_BUNDLE_PATH: ${{ steps.draft_asset.outputs.candidate_path }}
          INSTALLER_CI_RUN_ID: ${{ github.run_id }}
          E2E_REPORT_DIR: ${{ steps.preparar_reporte_e2e.outputs.report_dir }}
        run: |
          if (-not (Test-Path -LiteralPath $env:CANDIDATE_BUNDLE_PATH)) { throw 'Falta el EXE descargado del release draft.' }
          if (-not (Test-Path -LiteralPath $env:BASELINE_BUNDLE_PATH)) { throw 'Falta el baseline oficial v1.2.3.' }
          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_VERSION_RELATED_BUNDLE_PATH)) { throw 'Falta el fixture Burn relacionado de versión previa.' }
          $runnerArgs = @(
            '-RootPath', $env:GITHUB_WORKSPACE,
            '-ReleaseManifestPath', (Join-Path $env:GITHUB_WORKSPACE 'dist\installer\EvaluaPro-release-manifest.json'),
            '-ReportDir', $env:E2E_REPORT_DIR,
            '-InstallDir', (Join-Path $env:LOCALAPPDATA 'EvaluaPro-QA-Isolated-published-e2e'),
            '-CandidateBundlePath', $env:CANDIDATE_BUNDLE_PATH,
            '-BaselineBundlePath', $env:BASELINE_BUNDLE_PATH,
            '-SameVersionRelatedBundlePath', $env:SAME_VERSION_RELATED_BUNDLE_PATH,
            '-PreviousVersionRelatedBundlePath', $env:PREVIOUS_VERSION_RELATED_BUNDLE_PATH,
            '-Port', '4519',
            '-IUnderstandThisMutatesPc',
            '-SeedDummyData'
          )
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/installer-hub-e2e-docente.ps1 @runnerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar evidencia E2E del asset descargado
        if: always() && steps.preparar_reporte_e2e.outputs.report_dir != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-hub-published-e2e-${{ github.run_id }}
          path: ${{ steps.preparar_reporte_e2e.outputs.report_dir }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Limpiar confianza temporal de firma en runner
        if: ${{ always() && env.EVALUAPRO_TEMP_TRUST_THUMBPRINT != '' }}
        shell: powershell
        run: |
          $thumbprint = $env:EVALUAPRO_TEMP_TRUST_THUMBPRINT
          $storeManager = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/manage-temporary-root-certificate.ps1'
          & $storeManager -Action Remove -Thumbprint $thumbprint -TimeoutSeconds 45


  finalize_installer_release:
    name: Hacer público el release tras E2E aprobada
    needs: [publish_installer_release, post_publish_installer_e2e]
    if: ${{ always() && !cancelled() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/hub-v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && needs.publish_installer_release.result == 'success' && needs.post_publish_installer_e2e.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Publicar el release draft validado
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.publish_installer_release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo 'ID del release draft inválido.' >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false

      - name: Retirar release estable anterior v1.1.5
        if: github.ref == 'refs/tags/hub-v1.1.6'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.5 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete v1.1.5 --repo "${GITHUB_REPOSITORY}" --yes
          else
            echo 'El release v1.1.5 ya no existe; no hay nada que retirar.'
          fi

  verify_public_installer_e2e:
    name: E2E del asset público descargado desde GitHub
    needs: [finalize_installer_release, post_publish_installer_e2e]
    if: ${{ always() && !cancelled() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/hub-v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && needs.finalize_installer_release.result == 'success' && needs.post_publish_installer_e2e.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Descargar código de la tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Configurar .NET SDK 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar WiX CLI estable para la E2E
        shell: powershell
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7
          $dotnetToolsDir = Join-Path $env:USERPROFILE ".dotnet\tools"
          if (-not (Test-Path $dotnetToolsDir)) { throw "No se encontró la carpeta de herramientas .NET global ($dotnetToolsDir)." }
          "$dotnetToolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wixPath = Join-Path $dotnetToolsDir "wix.exe"
          if (-not (Test-Path $wixPath)) { throw "No se encontró wix.exe en la carpeta de herramientas .NET global ($dotnetToolsDir)." }
          $wixVersion = (& $wixPath --version | Select-Object -First 1)
          if ($wixVersion -notmatch '^7\.0\.\d+(?:[+\-].*)?$') { throw "Versión WiX no permitida: $wixVersion. Se requiere 7.0.x." }

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Instalar dependencias de la E2E
        shell: powershell
        run: |
          npm install --global npm@12.2.1
          npm ci --foreground-scripts
          npx prisma generate --config=apps/backend/prisma.config.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Descargar y verificar el asset público por su URL de release
        id: public_asset
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          VERIFIED_DRAFT_SHA256: ${{ needs.post_publish_installer_e2e.outputs.draft_sha256 }}
        run: |
          $repository = $env:RELEASE_REPOSITORY
          $tag = $env:RELEASE_TAG
          if ($repository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Repositorio inválido.' }
          if ($tag -notmatch '^hub-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$') { throw 'Tag de release inválida.' }
          $packageVersion = [string](Get-Content -Raw -LiteralPath 'config/hub-version.json' | ConvertFrom-Json).version
          if ("hub-v$packageVersion" -ne $tag) { throw "La versión del Hub ($packageVersion) no coincide con la tag ($tag)." }
          $release = gh api "repos/$repository/releases/tags/$tag" | ConvertFrom-Json
          if ($release.draft -or $release.tag_name -ne $tag) { throw "El release $tag no está publicado." }
          $candidateName = "EvaluaPro-InstallerHub-docente-local-v$packageVersion.exe"
          $candidateAsset = @($release.assets | Where-Object { $_.name -eq $candidateName }) | Select-Object -First 1
          $sidecarAsset = @($release.assets | Where-Object { $_.name -eq ($candidateName + '.sha256') }) | Select-Object -First 1
          $manifestAsset = @($release.assets | Where-Object { $_.name -eq 'EvaluaPro-release-manifest.json' }) | Select-Object -First 1
          $certificateAsset = @($release.assets | Where-Object { $_.name -eq 'EvaluaPro-CodeSigning-Certificate.cer' }) | Select-Object -First 1
          $certificateShaAsset = @($release.assets | Where-Object { $_.name -eq 'EvaluaPro-CodeSigning-Certificate.cer.sha256' }) | Select-Object -First 1
          $trustGuideAsset = @($release.assets | Where-Object { $_.name -eq 'FIRMA-LEEME.md' }) | Select-Object -First 1
          if (-not $candidateAsset -or -not $sidecarAsset -or -not $manifestAsset -or -not $certificateAsset -or -not $certificateShaAsset -or -not $trustGuideAsset) {
            throw "El release público no contiene el EXE, sidecar, manifiesto y material de confianza manual esperado para $tag."
          }
          $expectedUrl = "https://github.com/$repository/releases/download/$tag/$candidateName"
          if ([string]$candidateAsset.browser_download_url -ne $expectedUrl) { throw 'La URL pública del asset no coincide con la ruta canónica del release.' }
          if ([string]$sidecarAsset.browser_download_url -ne ($expectedUrl + '.sha256')) { throw 'La URL pública del sidecar no coincide con el instalador.' }
          $expectedManifestUrl = "https://github.com/$repository/releases/download/$tag/EvaluaPro-release-manifest.json"
          if ([string]$manifestAsset.browser_download_url -ne $expectedManifestUrl) { throw 'La URL pública del manifiesto no coincide con la ruta canónica del release.' }
          $expectedCertificateUrl = "https://github.com/$repository/releases/download/$tag/EvaluaPro-CodeSigning-Certificate.cer"
          if ([string]$certificateAsset.browser_download_url -ne $expectedCertificateUrl) { throw 'La URL pública del certificado no coincide con la ruta canónica del release.' }
          $digestMatch = [regex]::Match([string]$candidateAsset.digest, '(?i)^sha256:([0-9a-f]{64})$')
          if (-not $digestMatch.Success) { throw "GitHub no reportó digest SHA-256 válido para $candidateName." }
          $downloadDir = Join-Path $env:RUNNER_TEMP ('public-installer-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          $candidatePath = Join-Path $downloadDir $candidateName
          $sidecarPath = $candidatePath + '.sha256'
          $releaseManifestPath = Join-Path $env:GITHUB_WORKSPACE 'dist\installer\EvaluaPro-release-manifest.json'
          $manifestDigest = [regex]::Match([string]$manifestAsset.digest, '(?i)^sha256:([0-9a-f]{64})$')
          $certificateDigest = [regex]::Match([string]$certificateAsset.digest, '(?i)^sha256:([0-9a-f]{64})$')
          $certificateShaDigest = [regex]::Match([string]$certificateShaAsset.digest, '(?i)^sha256:([0-9a-f]{64})$')
          $trustGuideDigest = [regex]::Match([string]$trustGuideAsset.digest, '(?i)^sha256:([0-9a-f]{64})$')
          if (-not $manifestDigest.Success -or -not $certificateDigest.Success -or -not $certificateShaDigest.Success -or -not $trustGuideDigest.Success) {
            throw 'La API de GitHub no reportó digest SHA-256 válido para alguno de los assets públicos.'
          }
          New-Item -ItemType Directory -Path (Split-Path -Parent $releaseManifestPath) -Force | Out-Null
          $certificatePath = Join-Path $downloadDir 'EvaluaPro-CodeSigning-Certificate.cer'
          $certificateShaPath = $certificatePath + '.sha256'
          $trustGuidePath = Join-Path $downloadDir 'FIRMA-LEEME.md'
          $downloadScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/download-github-release-asset.ps1'
          & $downloadScript -Uri ([uri]$expectedUrl) -Destination $candidatePath -ExpectedLength ([long]$candidateAsset.size) -ExpectedSha256 $digestMatch.Groups[1].Value
          & $downloadScript -Uri ([uri][string]$sidecarAsset.browser_download_url) -Destination $sidecarPath -ExpectedLength ([long]$sidecarAsset.size)
          & $downloadScript -Uri ([uri][string]$manifestAsset.browser_download_url) -Destination $releaseManifestPath -ExpectedLength ([long]$manifestAsset.size) -ExpectedSha256 $manifestDigest.Groups[1].Value
          & $downloadScript -Uri ([uri][string]$certificateAsset.browser_download_url) -Destination $certificatePath -ExpectedLength ([long]$certificateAsset.size) -ExpectedSha256 $certificateDigest.Groups[1].Value
          & $downloadScript -Uri ([uri][string]$certificateShaAsset.browser_download_url) -Destination $certificateShaPath -ExpectedLength ([long]$certificateShaAsset.size) -ExpectedSha256 $certificateShaDigest.Groups[1].Value
          & $downloadScript -Uri ([uri][string]$trustGuideAsset.browser_download_url) -Destination $trustGuidePath -ExpectedLength ([long]$trustGuideAsset.size) -ExpectedSha256 $trustGuideDigest.Groups[1].Value
          $certificateSidecar = [regex]::Match((Get-Content -Raw -LiteralPath $certificateShaPath), '(?i)^\s*([0-9a-f]{64})\s+')
          if (-not $certificateSidecar.Success -or $certificateSidecar.Groups[1].Value.ToLowerInvariant() -ne $certificateDigest.Groups[1].Value.ToLowerInvariant()) {
            throw 'El sidecar del certificado público no coincide con el digest publicado.'
          }
          $trustHelper = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/trust-release-signing-certificate.ps1'
          & $trustHelper -TargetPath $candidatePath -CertificatePath $certificatePath -ExpectedCertificateSha256 $certificateDigest.Groups[1].Value
          $releaseManifest = Get-Content -Raw -LiteralPath $releaseManifestPath | ConvertFrom-Json
          if ([string]$releaseManifest.version -ne $packageVersion -or
              [string]$releaseManifest.hubVersion -ne $packageVersion -or
              [string]$releaseManifest.appVersion -ne [string](Get-Content -Raw -LiteralPath 'config/app-version.json' | ConvertFrom-Json).version -or
              [string]$releaseManifest.build.version -ne $packageVersion -or
              [string]$releaseManifest.build.commit -ne [string]$release.target_commitish -or
              @($releaseManifest.flavors).Count -ne 1 -or
              [string]$releaseManifest.flavors[0].flavorId -ne 'docente-local') {
            throw 'El manifiesto descargado no corresponde a la versión, SHA y flavor del release público.'
          }
          $sidecarMatch = [regex]::Match((Get-Content -Raw -LiteralPath $sidecarPath), '(?i)^\s*([0-9a-f]{64})\s+')
          $actualHash = (Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $sidecarMatch.Success -or $sidecarMatch.Groups[1].Value.ToLowerInvariant() -ne $actualHash) { throw 'El SHA-256 del EXE público no coincide con su sidecar.' }
          if ($digestMatch.Groups[1].Value.ToLowerInvariant() -ne $actualHash) { throw 'El SHA-256 del EXE público no coincide con el digest de GitHub.' }
          if ($env:VERIFIED_DRAFT_SHA256 -notmatch '^(?i)[0-9a-f]{64}$') { throw 'El digest del asset draft no es válido.' }
          if ($actualHash -ne $env:VERIFIED_DRAFT_SHA256.ToLowerInvariant()) { throw 'El EXE público no coincide con el asset draft previamente verificado.' }
          "sha256=$actualHash" >> $env:GITHUB_OUTPUT
          "candidate_path=$candidatePath" >> $env:GITHUB_OUTPUT
          Write-Host "Asset público descargado por browser_download_url; tag=$tag; bytes=$((Get-Item -LiteralPath $candidatePath).Length); sha256=$actualHash"

      - name: Descargar y verificar baseline oficial v1.2.3
        shell: powershell
        env:
          BASELINE_BUNDLE_NAME: EvaluaPro-InstallerHub-docente-local-v1.2.3.exe
        run: |
          $baselineDir = Join-Path $env:RUNNER_TEMP 'evaluapro-upgrade-baseline-v1.2.3'
          New-Item -ItemType Directory -Path $baselineDir -Force | Out-Null
          $baselinePath = Join-Path $baselineDir $env:BASELINE_BUNDLE_NAME
          $baselineUrl = 'https://github.com/Dtcsrni/EvaluaPro_Sistema_Universitario/releases/download/v1.2.3/' + $env:BASELINE_BUNDLE_NAME
          $expectedHash = '644984c84fc05c4ec1f3804bda9d20666d229f7bab23caeb3a9c767179c82913'
          $downloadScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/download-github-release-asset.ps1'
          & $downloadScript -Uri $baselineUrl -Destination $baselinePath -ExpectedLength 249491600 -ExpectedSha256 $expectedHash
          & $downloadScript -Uri ($baselineUrl + '.sha256') -Destination ($baselinePath + '.sha256') -MaxAttempts 3
          $sidecar = [regex]::Match((Get-Content -Raw -LiteralPath ($baselinePath + '.sha256')), '(?i)^\s*([0-9a-f]{64})\s+')
          $actualHash = (Get-FileHash -LiteralPath $baselinePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $sidecar.Success -or $sidecar.Groups[1].Value.ToLowerInvariant() -ne $expectedHash -or $actualHash -ne $expectedHash) { throw 'El baseline oficial v1.2.3 no coincide con el SHA-256 fijado.' }
          "BASELINE_BUNDLE_PATH=$baselinePath" >> $env:GITHUB_ENV

      - name: Compilar fixture Burn para el asset público
        shell: powershell
        env:
          CANDIDATE_BUNDLE_PATH: ${{ steps.public_asset.outputs.candidate_path }}
        run: |
          $fixtureOutput = Join-Path $env:RUNNER_TEMP 'EvaluaPro-QA-SameVersionRelatedBundle.exe'
          & scripts/tests/build-same-version-related-bundle-fixture.ps1 -CandidateBundlePath $env:CANDIDATE_BUNDLE_PATH -OutputPath $fixtureOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previousFixtureOutput = Join-Path $env:RUNNER_TEMP 'EvaluaPro-QA-PreviousVersionRelatedBundle.exe'
          & scripts/tests/build-same-version-related-bundle-fixture.ps1 -CandidateBundlePath $env:CANDIDATE_BUNDLE_PATH -OutputPath $previousFixtureOutput -FixtureVersion '1.2.0.0' -EnvironmentVariableName 'PREVIOUS_VERSION_RELATED_BUNDLE_PATH'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preparar ruta privada para evidencia E2E pública
        id: preparar_reporte_e2e
        shell: powershell
        env:
          INSTALLER_CI_RUN_ID: ${{ github.run_id }}
          INSTALLER_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ($env:INSTALLER_CI_RUN_ID -notmatch '^[0-9]+$' -or $env:INSTALLER_CI_RUN_ATTEMPT -notmatch '^[0-9]+$') { throw 'Identificadores de ejecución inválidos.' }
          if ([string]::IsNullOrWhiteSpace($env:USERPROFILE)) { throw 'El runner no expuso su perfil de usuario.' }
          $reportDir = Join-Path $env:USERPROFILE ('installer-hub-e2e-public-ci-' + $env:INSTALLER_CI_RUN_ID + '-' + $env:INSTALLER_CI_RUN_ATTEMPT)
          "report_dir=$reportDir" >> $env:GITHUB_OUTPUT

      - name: E2E completa sobre el instalador descargado del release público
        shell: powershell
        env:
          EVALUAPRO_INSTALLER_SIMULATE_WSL_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_SIMULATE_AUTO_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_AUTO_BOOTSTRAP_WSL: '1'
          EVALUAPRO_LICENSE_ACTIVATION_SIMULATE: '1'
          CANDIDATE_BUNDLE_PATH: ${{ steps.public_asset.outputs.candidate_path }}
          INSTALLER_CI_RUN_ID: ${{ github.run_id }}
          E2E_REPORT_DIR: ${{ steps.preparar_reporte_e2e.outputs.report_dir }}
        run: |
          if (-not (Test-Path -LiteralPath $env:CANDIDATE_BUNDLE_PATH)) { throw 'Falta el EXE descargado del release público.' }
          if (-not (Test-Path -LiteralPath $env:BASELINE_BUNDLE_PATH)) { throw 'Falta el baseline oficial v1.2.3.' }
          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_VERSION_RELATED_BUNDLE_PATH)) { throw 'Falta el fixture Burn relacionado de versión previa.' }
          $runnerArgs = @(
            '-RootPath', $env:GITHUB_WORKSPACE,
            '-ReleaseManifestPath', (Join-Path $env:GITHUB_WORKSPACE 'dist\installer\EvaluaPro-release-manifest.json'),
            '-ReportDir', $env:E2E_REPORT_DIR,
            '-InstallDir', (Join-Path $env:LOCALAPPDATA 'EvaluaPro-QA-Isolated-public-release-e2e'),
            '-CandidateBundlePath', $env:CANDIDATE_BUNDLE_PATH,
            '-BaselineBundlePath', $env:BASELINE_BUNDLE_PATH,
            '-SameVersionRelatedBundlePath', $env:SAME_VERSION_RELATED_BUNDLE_PATH,
            '-PreviousVersionRelatedBundlePath', $env:PREVIOUS_VERSION_RELATED_BUNDLE_PATH,
            '-Port', '4521',
            '-IUnderstandThisMutatesPc',
            '-SeedDummyData'
          )
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/installer-hub-e2e-docente.ps1 @runnerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar evidencia E2E del release público
        if: always() && steps.preparar_reporte_e2e.outputs.report_dir != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-hub-public-e2e-${{ github.run_id }}
          path: ${{ steps.preparar_reporte_e2e.outputs.report_dir }}/
          if-no-files-found: warn
          retention-days: 90

      - name: Limpiar confianza temporal de firma en runner
        if: ${{ always() && env.EVALUAPRO_TEMP_TRUST_THUMBPRINT != '' }}
        shell: powershell
        run: |
          $thumbprint = $env:EVALUAPRO_TEMP_TRUST_THUMBPRINT
          $storeManager = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/manage-temporary-root-certificate.ps1'
          & $storeManager -Action Remove -Thumbprint $thumbprint -TimeoutSeconds 45

  redraft_failed_public_installer_release:
    name: Ocultar release si falla la E2E del asset público
    needs: verify_public_installer_e2e
    if: ${{ always() && needs.verify_public_installer_e2e.result != 'success' && needs.verify_public_installer_e2e.result != 'skipped' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/hub-v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Volver a borrador el release no validado
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo 'No se pudo resolver el release para ocultarlo.' >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=true

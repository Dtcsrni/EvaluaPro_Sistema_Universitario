name: CI Installer Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-installer-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  installer_windows:
    name: Installer Windows (MSI + Bundle)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Etapa setup
        run: npm ci --foreground-scripts

      - name: Instalar WiX CLI estable (v6+)
        shell: powershell
        run: |
          winget install --id WiXToolset.WiXCLI --accept-source-agreements --accept-package-agreements

      - name: Registrar WiX en PATH
        shell: powershell
        run: |
          $wixBin = 'C:\Program Files\WiX Toolset v6.0\bin'
          if (-not (Test-Path $wixBin)) { throw "No se encontro WiX en $wixBin" }
          "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$wixBin\wix.exe" --version

      - name: Etapa policy-check WiX
        run: npm run test:wix:policy

      - name: Etapa contract-check Installer Hub
        run: npm run test:installer-hub:contract

      - name: Etapa build MSI + Bundle
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-msi.ps1 -SkipStabilityChecks -IncludeBundle -Flavor all

      - name: Etapa build Installer Hub EXE
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-installer-hub.ps1 -Flavor all

      - name: Etapa hash/manifest de release instalador
        shell: powershell
        run: |
          $isTag = "${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true"
          if ($isTag) {
            $tag = "${{ github.ref_name }}"
            $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-installer-hashes.ps1 -ReleaseBaseUrl "$base"
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-installer-hashes.ps1
          }

      - name: Empaquetar instalacion simple para usuario final
        shell: powershell
        run: |
          $zipPath = 'dist/installer/EvaluaPro-Instalador-Windows.zip'
          $zipShaPath = 'dist/installer/EvaluaPro-Instalador-Windows.zip.sha256'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'evaluapro-instalacion-simple'
          $readmePath = Join-Path $packageRoot 'LEEME-INSTALACION.txt'
          $setupPath = 'dist/installer/EvaluaPro-docente-local-Setup.exe'
          if (-not (Test-Path $setupPath)) {
            throw "No se encontro instalador esperado: $setupPath"
          }

          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item -Path $setupPath -Destination (Join-Path $packageRoot 'EvaluaPro-Setup.exe') -Force

          @(
            'EvaluaPro - Instalacion simple (Windows)',
            '',
            'Pasos:',
            '1) Extrae este .zip en una carpeta local.',
            '2) Ejecuta EvaluaPro-Setup.exe.',
            '3) Sigue el asistente de instalacion.',
            '',
            'Si Windows pide confirmacion, valida el archivo y permite la ejecucion.'
          ) | Set-Content -Path $readmePath -Encoding utf8

          if (Test-Path $zipPath) { Remove-Item -Path $zipPath -Force }
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -Force
          $zipHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  EvaluaPro-Instalador-Windows.zip" | Set-Content -Path $zipShaPath -Encoding utf8

      - name: Antivirus gate de instalador simple
        shell: powershell
        run: |
          $zipPath = 'dist/installer/EvaluaPro-Instalador-Windows.zip'
          if (-not (Test-Path $zipPath)) {
            throw "No se encontro paquete para antivirus: $zipPath"
          }

          $candidatePaths = @(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
            "$env:ProgramFiles\Microsoft Defender\MpCmdRun.exe"
          )
          $wildcards = @(
            "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe"
          )

          foreach ($pattern in $wildcards) {
            $found = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($found) { $candidatePaths += $found.FullName }
          }

          $mpCmdRun = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mpCmdRun) {
            throw 'No se encontro MpCmdRun.exe (Microsoft Defender) en el runner.'
          }

          & $mpCmdRun -SignatureUpdate | Out-Null
          & $mpCmdRun -Scan -ScanType 3 -File $zipPath
          if ($LASTEXITCODE -ne 0) {
            throw "Antivirus detecto incidente o no pudo validar el archivo (exit code: $LASTEXITCODE)."
          }

          @(
            "scanner=Microsoft Defender",
            "scannerPath=$mpCmdRun",
            "target=$zipPath",
            "result=clean",
            "timestampUtc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -Path 'dist/installer/antivirus-scan-report.txt' -Encoding utf8

      - name: Etapa signing gate (opcional)
        shell: powershell
        env:
          EVALUAPRO_SIGN_CERT_BASE64: ${{ secrets.EVALUAPRO_SIGN_CERT_BASE64 }}
          EVALUAPRO_SIGN_CERT_PASSWORD: ${{ secrets.EVALUAPRO_SIGN_CERT_PASSWORD }}
          EVALUAPRO_SIGN_TIMESTAMP_URL: ${{ secrets.EVALUAPRO_SIGN_TIMESTAMP_URL }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-installer-artifacts.ps1

      - name: Verificar artefactos
        shell: powershell
        run: |
          if (-not (Test-Path "dist/installer/EvaluaPro-saas-completo.msi")) { throw "No existe dist/installer/EvaluaPro-saas-completo.msi" }
          if (-not (Test-Path "dist/installer/EvaluaPro-docente-local.msi")) { throw "No existe dist/installer/EvaluaPro-docente-local.msi" }
          if (-not (Test-Path "dist/installer/EvaluaPro-saas-completo-Setup.exe")) { throw "No existe dist/installer/EvaluaPro-saas-completo-Setup.exe" }
          if (-not (Test-Path "dist/installer/EvaluaPro-docente-local-Setup.exe")) { throw "No existe dist/installer/EvaluaPro-docente-local-Setup.exe" }
          if (-not (Test-Path "dist/installer/EvaluaPro-InstallerHub-saas-completo.exe")) { throw "No existe dist/installer/EvaluaPro-InstallerHub-saas-completo.exe" }
          if (-not (Test-Path "dist/installer/EvaluaPro-InstallerHub-docente-local.exe")) { throw "No existe dist/installer/EvaluaPro-InstallerHub-docente-local.exe" }
          if (-not (Test-Path "dist/installer/EvaluaPro-saas-completo.msi.sha256")) { throw "No existe dist/installer/EvaluaPro-saas-completo.msi.sha256" }
          if (-not (Test-Path "dist/installer/EvaluaPro-docente-local.msi.sha256")) { throw "No existe dist/installer/EvaluaPro-docente-local.msi.sha256" }
          if (-not (Test-Path "dist/installer/EvaluaPro-release-manifest.json")) { throw "No existe dist/installer/EvaluaPro-release-manifest.json" }
          if (-not (Test-Path "dist/installer/EvaluaPro-Instalador-Windows.zip")) { throw "No existe dist/installer/EvaluaPro-Instalador-Windows.zip" }
          if (-not (Test-Path "dist/installer/EvaluaPro-Instalador-Windows.zip.sha256")) { throw "No existe dist/installer/EvaluaPro-Instalador-Windows.zip.sha256" }
          if (-not (Test-Path "dist/installer/antivirus-scan-report.txt")) { throw "No existe dist/installer/antivirus-scan-report.txt" }

      - name: Publicar artefactos instalador
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            dist/installer/EvaluaPro-Instalador-Windows.zip
            dist/installer/EvaluaPro-Instalador-Windows.zip.sha256
            dist/installer/antivirus-scan-report.txt
            dist/installer/EvaluaPro-saas-completo.msi
            dist/installer/EvaluaPro-saas-completo.msi.sha256
            dist/installer/EvaluaPro-saas-completo-Setup.exe
            dist/installer/EvaluaPro-saas-completo-Setup.exe.sha256
            dist/installer/EvaluaPro-InstallerHub-saas-completo.exe
            dist/installer/EvaluaPro-InstallerHub-saas-completo.exe.sha256
            dist/installer/EvaluaPro-docente-local.msi
            dist/installer/EvaluaPro-docente-local.msi.sha256
            dist/installer/EvaluaPro-docente-local-Setup.exe
            dist/installer/EvaluaPro-docente-local-Setup.exe.sha256
            dist/installer/EvaluaPro-InstallerHub-docente-local.exe
            dist/installer/EvaluaPro-InstallerHub-docente-local.exe.sha256
            dist/installer/EvaluaPro-release-manifest.json
            dist/installer/SIGNING-NOT-PRODUCTION.txt
            dist/installer/*.wixpdb

      - name: Publicar release assets (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          make_latest: ${{ !(contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc')) }}
          files: |
            dist/installer/EvaluaPro-Instalador-Windows.zip
            dist/installer/EvaluaPro-Instalador-Windows.zip.sha256
            dist/installer/antivirus-scan-report.txt
            dist/installer/EvaluaPro-saas-completo.msi
            dist/installer/EvaluaPro-saas-completo.msi.sha256
            dist/installer/EvaluaPro-saas-completo-Setup.exe
            dist/installer/EvaluaPro-saas-completo-Setup.exe.sha256
            dist/installer/EvaluaPro-InstallerHub-saas-completo.exe
            dist/installer/EvaluaPro-InstallerHub-saas-completo.exe.sha256
            dist/installer/EvaluaPro-docente-local.msi
            dist/installer/EvaluaPro-docente-local.msi.sha256
            dist/installer/EvaluaPro-docente-local-Setup.exe
            dist/installer/EvaluaPro-docente-local-Setup.exe.sha256
            dist/installer/EvaluaPro-InstallerHub-docente-local.exe
            dist/installer/EvaluaPro-InstallerHub-docente-local.exe.sha256
            dist/installer/EvaluaPro-release-manifest.json

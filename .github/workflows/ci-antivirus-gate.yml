name: CI Antivirus Gate

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-beta.yml"
      - ".github/workflows/ci-installer-windows.yml"
      - "scripts/release/**"
      - "README.md"
      - "docs/VERSIONADO.md"
  pull_request:
    paths:
      - ".github/workflows/release-beta.yml"
      - ".github/workflows/ci-installer-windows.yml"
      - "scripts/release/**"
      - "README.md"
      - "docs/VERSIONADO.md"
  workflow_dispatch:

concurrency:
  group: ci-antivirus-gate-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  antivirus_contract:
    name: Antivirus Gate Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar contrato AV en workflows de release
        shell: bash
        run: |
          set -euo pipefail
          for wf in .github/workflows/release-beta.yml .github/workflows/ci-installer-windows.yml; do
            grep -q "run-defender-scan.ps1" "$wf"
            grep -q "EvaluaPro-InstallerHub-saas-completo.exe" "$wf"
            grep -q "EvaluaPro-InstallerHub-docente-local.exe" "$wf"
            grep -q "EvaluaPro-release-manifest.json" "$wf"
            grep -q "antivirus-scan-report.txt" "$wf"
          done
          echo "Contrato AV presente en release beta e instalador Windows con assets oficiales vigentes."

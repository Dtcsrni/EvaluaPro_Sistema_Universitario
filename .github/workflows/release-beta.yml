name: Release Beta

on:
  workflow_run:
    workflows:
      - CI Checks
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tecnica base (ej. 1.0.0)"
        required: false
        type: string
      head_sha:
        description: "SHA a publicar (opcional)"
        required: false
        type: string
      base_ref:
        description: "Referencia base de diff (opcional)"
        required: false
        type: string
      reason:
        description: "Motivo de la publicacion manual beta"
        required: false
        type: string

concurrency:
  group: release-beta-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.version || inputs.head_sha || github.ref_name) || format('auto-{0}', github.event.workflow_run.head_branch || github.ref_name) }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  beta_gate:
    name: Evaluar publicacion beta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')

    outputs:
      publish: ${{ steps.beta.outputs.publish }}
      beta_tag: ${{ steps.beta.outputs.beta_tag }}
      beta_version: ${{ steps.beta.outputs.beta_version }}
      base_ref: ${{ steps.beta.outputs.base_ref }}
      head_sha: ${{ steps.beta.outputs.head_sha }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha || github.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Configurar .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Instalar dependencias
        run: npm ci --foreground-scripts

      - name: Evaluar alcance beta
        id: beta
        shell: bash
        env:
          BETA_VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          BETA_HEAD_SHA_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
          BETA_BASE_REF_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || '' }}
          BETA_REASON_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || '' }}
        run: |
          set -euo pipefail
          report_dir="reports/release/beta"
          if [ -n "$BETA_VERSION_INPUT" ]; then
            node scripts/release/validate-beta-promotion.mjs --version="$BETA_VERSION_INPUT" --head-sha="$BETA_HEAD_SHA_INPUT" --base-ref="$BETA_BASE_REF_INPUT" --reason="$BETA_REASON_INPUT" --report-dir="$report_dir" || true
          else
            node scripts/release/validate-beta-promotion.mjs --head-sha="$BETA_HEAD_SHA_INPUT" --base-ref="$BETA_BASE_REF_INPUT" --reason="$BETA_REASON_INPUT" --report-dir="$report_dir" || true
          fi

          version_guess="${BETA_VERSION_INPUT:-$(node -e "const p=require('./package.json'); process.stdout.write(String(p.version || ''))")}"
          base_version="${version_guess%%-*}"
          decision_file="$(find "$report_dir" -name decision.json | sort | tail -n 1)"
          if [ -z "$decision_file" ] || [ ! -f "$decision_file" ]; then
            echo "No se encontro decision.json de beta." >&2
            exit 1
          fi

          node - "$decision_file" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const out = process.env.GITHUB_OUTPUT;
          const lines = [
            `publish=${data.decision === 'Go'}`,
            `beta_tag=${data.tagName || ''}`,
            `beta_version=${data.betaVersion || ''}`,
            `base_ref=${data.baseRef || ''}`,
            `head_sha=${data.headSha || ''}`
          ];
          fs.appendFileSync(out, `${lines.join('\n')}\n`);
          NODE

      - name: Publicar decision beta
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: beta-gate-decision
          path: reports/release/beta/**/decision.json
          if-no-files-found: warn

  beta_release:
    name: Publicar prerelease beta
    runs-on: windows-latest
    timeout-minutes: 60
    needs:
      - beta_gate
    if: needs.beta_gate.outputs.publish == 'true'

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.beta_gate.outputs.head_sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Configurar .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Instalar dependencias
        run: npm ci --foreground-scripts

      - name: Instalar WiX CLI estable (v6.0.2)
        shell: powershell
        run: |
          dotnet tool install --global wix --version 6.0.2

      - name: Registrar WiX en PATH y Validar Versión
        shell: powershell
        run: |
          $dotnetToolsDir = Join-Path $env:USERPROFILE ".dotnet\tools"
          if (-not (Test-Path $dotnetToolsDir)) {
            New-Item -ItemType Directory -Path $dotnetToolsDir -Force | Out-Null
          }
          "$dotnetToolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wixPath = Join-Path $dotnetToolsDir "wix.exe"
          if (-not (Test-Path $wixPath)) {
            throw "No se encontro wix.exe en la carpeta de herramientas .NET global ($dotnetToolsDir)"
          }
          $wixVersion = (& $wixPath --version | Select-Object -First 1)
          if ($wixVersion -notmatch '^6\.0\.\d+(?:[+\-].*)?$') { throw "Version WiX no permitida: $wixVersion. Se requiere 6.0.x." }
          Write-Host "WiX version detectada: $wixVersion"

      - name: Etapa policy-check WiX
        run: npm run test:wix:policy

      - name: Etapa contract-check Installer Hub
        run: node --test scripts/tests/installer-hub-contract.test.mjs

      - name: Etapa windows-release-smoke Installer Hub
        env:
          EVALUAPRO_INSTALLER_SIMULATE_WSL_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_SIMULATE_AUTO_BOOTSTRAP: '1'
          EVALUAPRO_INSTALLER_AUTO_BOOTSTRAP_WSL: '1'
          EVALUAPRO_LICENSE_ACTIVATION_SIMULATE: '1'
        run: node --test scripts/tests/windows-release-smoke.test.mjs

      - name: Etapa build MSI + Bundle
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-msi.ps1 -SkipStabilityChecks -IncludeBundle -Flavor all -Version "${{ needs.beta_gate.outputs.beta_version }}"

      - name: Gate footprint bundle docente
        run: npm run installer:docente:baseline:enforce

      - name: Smoke GUI del bundle Burn publico empaquetado
        shell: powershell
        run: |
          $exe = Get-ChildItem -LiteralPath 'dist/installer/docente-local' -Filter 'EvaluaPro-InstallerHub-docente-local-v*.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "No existe dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe" }
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 2
          if ($proc.HasExited) { throw 'El bundle Burn publico se cerro antes del smoke timeout.' }
          Start-Sleep -Seconds 3
          if (-not $proc.HasExited) {
            try { Stop-Process -Id $proc.Id -Force } catch {}
          }

      - name: Etapa hash/manifest beta
        shell: powershell
        run: |
          $tag = "${{ needs.beta_gate.outputs.beta_tag }}"
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-installer-hashes.ps1 -Channel beta -ReleaseBaseUrl "$base"

      - name: Antivirus gate del Installer Hub
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/run-defender-scan.ps1 -TargetPath 'dist/installer' -ReportPath 'dist/installer/antivirus-scan-report.txt'

      - name: Generar notas beta
        shell: bash
        env:
          BETA_VERSION_INPUT: ${{ needs.beta_gate.outputs.beta_version }}
          BETA_HEAD_SHA_INPUT: ${{ needs.beta_gate.outputs.head_sha }}
          BETA_BASE_REF_INPUT: ${{ needs.beta_gate.outputs.base_ref }}
          BETA_REASON_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || '' }}
        run: |
          set -euo pipefail
          report_dir="reports/release/beta"
          node scripts/release/validate-beta-promotion.mjs --version="$BETA_VERSION_INPUT" --head-sha="$BETA_HEAD_SHA_INPUT" --base-ref="$BETA_BASE_REF_INPUT" --reason="$BETA_REASON_INPUT" --report-dir="$report_dir"

      - name: Cargar notas beta
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="reports/release/beta/${{ needs.beta_gate.outputs.beta_version }}/notes.md"
          if [ -z "$notes_path" ] || [ ! -f "$notes_path" ]; then
            echo "No se encontro notes.md de beta." >&2
            exit 1
          fi
          {
            echo 'body<<EOF'
            cat "$notes_path"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Definir archivos de prerelease
        id: beta_assets
        shell: bash
        env:
          BETA_VERSION: ${{ needs.beta_gate.outputs.beta_version }}
        run: |
          set -euo pipefail
          files=(
            dist/installer/saas-completo/EvaluaPro-InstallerHub-saas-completo-v*.exe
            dist/installer/saas-completo/EvaluaPro-InstallerHub-saas-completo-v*.exe.sha256
            dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe
            dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v*.exe.sha256
            dist/installer/saas-completo/EvaluaPro-InstallerHub-saas-completo-v*.exe
            dist/installer/saas-completo/EvaluaPro-InstallerHub-saas-completo-v*.exe.sha256
            "dist/installer/EvaluaPro-release-manifest.json"
            "dist/installer/antivirus-scan-report.txt"
          )
          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publicar prerelease beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.beta_gate.outputs.beta_tag }}
          target_commitish: ${{ needs.beta_gate.outputs.head_sha }}
          name: ${{ needs.beta_gate.outputs.beta_tag }}
          prerelease: true
          make_latest: false
          body: ${{ steps.notes.outputs.body }}
          files: ${{ steps.beta_assets.outputs.files }}

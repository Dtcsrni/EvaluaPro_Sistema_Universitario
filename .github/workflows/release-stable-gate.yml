name: Release Stable Gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version estable a validar (ej. v1.0.0)"
        required: false
        type: string
      evidence_dir:
        description: "Ruta de evidencia (opcional)"
        required: false
        type: string

concurrency:
  group: release-stable-gate-${{ github.workflow }}-${{ inputs.version || github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  stable_gate:
    name: Stable Promotion Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-alpha') &&
      !contains(github.ref_name, '-beta') &&
      !contains(github.ref_name, '-rc'))

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Instalar dependencias
        run: npm ci --foreground-scripts

      - name: Resolver version objetivo
        id: resolve_version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TARGET="${{ inputs.version }}"
          else
            TARGET="${GITHUB_REF_NAME}"
          fi
          TARGET="${TARGET#v}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Materializar manifest del instalador publicado
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist/installer
          TAG="v${{ steps.resolve_version.outputs.target }}"
          for attempt in {1..40}; do
            if gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "EvaluaPro-release-manifest.json" \
              --dir "dist/installer" \
              --clobber; then
              test -s "dist/installer/EvaluaPro-release-manifest.json"
              exit 0
            fi
            echo "Manifest de instalador no disponible aun para $TAG (intento $attempt/40)."
            sleep 30
          done
          echo "No se pudo descargar EvaluaPro-release-manifest.json para $TAG." >&2
          exit 1

      - name: Ejecutar gate estable
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          node scripts/release/validate-stable-promotion.mjs
          --repo=${{ github.repository }}
          --version=${{ steps.resolve_version.outputs.target }}
          --required-streak=10
          --workflow=ci.yml
          --branch=main
          ${{ inputs.evidence_dir && format('--evidence-dir={0}', inputs.evidence_dir) || '' }}

      - name: Marcar release como Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ steps.resolve_version.outputs.target }}" --repo "${{ github.repository }}" --latest

      - name: Publicar decision de auditoria
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stable-gate-decision-${{ steps.resolve_version.outputs.target }}
          path: reports/release/stable-gate/${{ steps.resolve_version.outputs.target }}/decision.json
          if-no-files-found: warn

name: Release Stable Gate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "SHA completo de main que se evaluará"
        required: true
        type: string
      candidate_run_id:
        description: "run_id exitoso de CI Installer Windows con artefacto installer-windows"
        required: true
        type: string
      evidence_dir:
        description: "Directorio de evidencia versionada; por defecto docs/release/evidencias/<version>"
        required: false
        type: string

concurrency:
  group: release-stable-gate-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  stable_gate:
    name: Stable Promotion Gate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      target_version: ${{ steps.resolve_version.outputs.target }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Validar SHA candidato y descargar código exacto
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validar SHA de main y ejecución del artefacto candidato
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'source_sha debe ser un SHA completo.' >&2; exit 1; }
          SOURCE_SHA="${SOURCE_SHA,,}"
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'candidate_run_id debe ser numérico.' >&2; exit 1; }
          CHECKED_OUT="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          [[ "$CHECKED_OUT" == "$SOURCE_SHA" ]] || { echo 'El checkout no coincide con source_sha.' >&2; exit 1; }
          [[ "$MAIN_SHA" == "$SOURCE_SHA" ]] || { echo 'source_sha ya no es el HEAD actual de main.' >&2; exit 1; }
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          RUN_SHA="$(jq -r '.head_sha' <<<"$RUN")"
          RUN_BRANCH="$(jq -r '.head_branch' <<<"$RUN")"
          RUN_STATUS="$(jq -r '.conclusion' <<<"$RUN")"
          RUN_WORKFLOW="$(jq -r '.name' <<<"$RUN")"
          [[ "$RUN_SHA" == "$SOURCE_SHA" && "$RUN_BRANCH" == 'main' && "$RUN_STATUS" == 'success' && "$RUN_WORKFLOW" == 'CI Installer Windows' ]] || {
            echo 'La ejecución candidata debe ser exitosa, de CI Installer Windows y del mismo SHA de main.' >&2; exit 1;
          }
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Descargar artefacto inmutable del build candidato
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: installer-windows
          path: dist/installer
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Resolver versión del candidato
        id: resolve_version
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(node -p "require('./package.json').version")"
          [[ "$TARGET" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "La versión estable debe ser SemVer X.Y.Z: $TARGET" >&2; exit 1; }
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Comprobar manifiesto docente-local y versión antes de QA
        env:
          TARGET_VERSION: ${{ steps.resolve_version.outputs.target }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/installer/EvaluaPro-release-manifest.json
          node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("dist/installer/EvaluaPro-release-manifest.json","utf8")); const v=process.env.TARGET_VERSION; const sha=process.env.SOURCE_SHA; if (m.version!==v || m.build?.version!==v) throw Error("versión del manifest no coincide con package.json"); if (String(m.build?.commit).toLowerCase()!==sha.toLowerCase()) throw Error("build.commit no coincide con SHA candidato"); if (m.flavors?.length!==1 || m.flavors[0]?.flavorId!=="docente-local") throw Error("el artefacto debe contener únicamente docente-local");'
          test -s dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v"$TARGET_VERSION".exe
          test -s dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v"$TARGET_VERSION".exe.sha256

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Instalar dependencias
        run: |
          npm install --global npm@12.1.0
          npm ci --foreground-scripts

      - name: Preparar cliente Prisma para QA candidato
        run: npx prisma generate --config=apps/backend/prisma.config.mjs

      - name: Preparar evidencias visuales para manifiesto QA
        run: |
          npx playwright install --with-deps chromium
          npm run gui:screen-matrix
          git restore -- docs/release/manual/gui-screen-matrix.md
          npm run test:gui:responsive:e2e:ci

      - name: Confirmar árbol fuente limpio antes de QA completa
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Generar evidencia QA completa del SHA candidato
        run: npm run qa:full

      - name: Ejecutar gate estable
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_VERSION: ${{ steps.resolve_version.outputs.target }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        shell: bash
        run: |
          set -euo pipefail
          args=("--repo=$REPOSITORY" "--version=$TARGET_VERSION" "--required-streak=10" "--workflow=ci.yml" "--branch=main")
          [[ -z "$EVIDENCE_DIR" ]] || args+=("--evidence-dir=$EVIDENCE_DIR")
          RELEASE_CANDIDATE_SHA="$SOURCE_SHA" node scripts/release/validate-stable-promotion.mjs "${args[@]}"

      - name: Publicar decisión de auditoría
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stable-gate-decision-${{ steps.resolve_version.outputs.target }}
          path: |
            reports/release/stable-gate/${{ steps.resolve_version.outputs.target }}/decision.json
            reports/qa/latest/
          if-no-files-found: warn

  publish_after_go:
    name: Publicar release solo tras Go
    runs-on: ubuntu-latest
    needs: stable_gate
    if: needs.stable_gate.result == 'success'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Descargar instalador validado del run candidato
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: installer-windows
          path: dist/installer
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Crear tag y release estable desde el SHA aprobado
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ needs.stable_gate.outputs.target_version }}
          SOURCE_SHA: ${{ needs.stable_gate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$TARGET_VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "El release $TAG ya existe; se detiene para evitar sobrescribirlo." >&2; exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "La tag $TAG ya existe; se detiene para evitar reemplazarla." >&2; exit 1
          fi
          INSTALLER="dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-$TAG.exe"
          test -s "$INSTALLER"
          test -s "$INSTALLER.sha256"
          gh release create "$TAG" "$INSTALLER" "$INSTALLER.sha256" dist/installer/EvaluaPro-release-manifest.json dist/installer/antivirus-scan-report.txt \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "EvaluaPro $TAG" --notes "Release docente-local validado por Stable Promotion Gate." --latest=false

  verify_public_release:
    name: Verificar asset publicado contra el artefacto validado
    runs-on: ubuntu-latest
    needs: [stable_gate, publish_after_go]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Descargar artefacto candidato para cotejo
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: installer-windows
          path: expected
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Comparar asset público y hash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ needs.stable_gate.outputs.target_version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$TARGET_VERSION"
          NAME="EvaluaPro-InstallerHub-docente-local-$TAG.exe"
          mkdir -p public
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME*" --dir public
          EXPECTED="expected/docente-local/$NAME"
          ACTUAL="public/$NAME"
          test -s "$EXPECTED" && test -s "$ACTUAL"
          EXPECTED_SIZE="$(stat -c %s "$EXPECTED")"
          ACTUAL_SIZE="$(stat -c %s "$ACTUAL")"
          EXPECTED_HASH="$(sha256sum "$EXPECTED" | cut -d' ' -f1)"
          ACTUAL_HASH="$(sha256sum "$ACTUAL" | cut -d' ' -f1)"
          [[ "$EXPECTED_SIZE" == "$ACTUAL_SIZE" && "$EXPECTED_HASH" == "$ACTUAL_HASH" ]] || { echo 'El asset público no coincide con el artefacto candidato validado.' >&2; exit 1; }
          grep -qi "$ACTUAL_HASH" "public/$NAME.sha256"

  mark_latest:
    name: Marcar como Latest después de verificar el asset
    runs-on: ubuntu-latest
    needs: [stable_gate, verify_public_release]
    permissions:
      contents: write
    steps:
      - name: Promover release verificado a Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ needs.stable_gate.outputs.target_version }}
        run: gh release edit "v$TARGET_VERSION" --repo "$GITHUB_REPOSITORY" --latest

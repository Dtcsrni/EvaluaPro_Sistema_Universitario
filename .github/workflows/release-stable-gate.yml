name: Release Stable Gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version estable a validar (ej. v1.0.0)"
        required: false
        type: string
      evidence_dir:
        description: "Ruta de evidencia (opcional)"
        required: false
        type: string

concurrency:
  group: release-stable-gate-${{ github.workflow }}-${{ inputs.version || github.ref_name || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stable_gate:
    name: Stable Promotion Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-alpha') &&
      !contains(github.ref_name, '-beta') &&
      !contains(github.ref_name, '-rc'))

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Instalar dependencias
        run: |
          npm install --global npm@12.1.0
          npm ci --foreground-scripts

      - name: Resolver version objetivo
        id: resolve_version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$VERSION_INPUT" ]; then
            TARGET="$VERSION_INPUT"
          else
            TARGET="$TAG_NAME"
          fi
          TARGET="${TARGET#v}"
          if [[ ! "$TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version estable no valida: $TARGET" >&2
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Materializar manifest del instalador publicado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_VERSION: ${{ steps.resolve_version.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/installer
          TAG="v${TARGET_VERSION}"
          for attempt in {1..40}; do
            if gh release download "$TAG" \
              --repo "$GH_REPO" \
              --pattern "EvaluaPro-release-manifest.json" \
              --dir "dist/installer" \
              --clobber; then
              test -s "dist/installer/EvaluaPro-release-manifest.json"
              exit 0
            fi
            echo "Manifest de instalador no disponible aun para $TAG (intento $attempt/40)."
            sleep 30
          done
          echo "No se pudo descargar EvaluaPro-release-manifest.json para $TAG." >&2
          exit 1

      - name: Ejecutar gate estable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_VERSION: ${{ steps.resolve_version.outputs.target }}
          EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo "$GH_REPO"
            --version "$TARGET_VERSION"
            --required-streak 10
            --workflow ci.yml
            --branch main
          )
          if [[ -n "$EVIDENCE_DIR" ]]; then
            args+=(--evidence-dir "$EVIDENCE_DIR")
          fi
          node scripts/release/validate-stable-promotion.mjs "${args[@]}"

      - name: Marcar release como Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_VERSION: ${{ steps.resolve_version.outputs.target }}
        shell: bash
        run: gh release edit "v${TARGET_VERSION}" --repo "$GH_REPO" --latest

      - name: Publicar decision de auditoria
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stable-gate-decision-${{ steps.resolve_version.outputs.target }}
          path: reports/release/stable-gate/${{ steps.resolve_version.outputs.target }}/decision.json
          if-no-files-found: warn

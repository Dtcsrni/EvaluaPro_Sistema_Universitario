name: Release Stable Gate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "SHA completo de main que se evaluará"
        required: true
        type: string
      candidate_run_id:
        description: "run_id exitoso de CI Installer Windows con artefacto installer-windows"
        required: true
        type: string
      evidence_dir:
        description: "Directorio de evidencia versionada; por defecto docs/release/evidencias/<version>"
        required: false
        type: string
      dispatch_release_after_gate:
        description: "Despachar el flujo de release después de aprobar la validación estable"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-stable-gate-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  stable_gate:
    name: Stable Promotion Gate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      target_version: ${{ steps.resolve_version.outputs.target }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      installer_run_id: ${{ steps.candidate.outputs.installer_run_id }}
    steps:
      - name: Descargar el commit actual de main con evidencia de release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Descargar el SHA de código candidato
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Validar SHA de main y ejecución del artefacto candidato
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'source_sha debe ser un SHA completo.' >&2; exit 1; }
          SOURCE_SHA="${SOURCE_SHA,,}"
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'candidate_run_id debe ser numérico.' >&2; exit 1; }
          GATE_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          [[ "$GATE_SHA" == "$GITHUB_SHA" && "$MAIN_SHA" == "$GATE_SHA" ]] || { echo 'El gate debe ejecutarse desde el HEAD actual de main.' >&2; exit 1; }
          git merge-base --is-ancestor "$SOURCE_SHA" "$GATE_SHA" || { echo 'source_sha debe ser ancestro del main actual.' >&2; exit 1; }
          VERSION="$(node -p "require('./package.json').version")"
          CANDIDATE_VERSION="$(node -p "require('./candidate/package.json').version")"
          [[ "$VERSION" == "$CANDIDATE_VERSION" ]] || { echo 'La versión candidata cambió después del SHA de build.' >&2; exit 1; }
          EVIDENCE_PREFIX="docs/release/evidencias/$VERSION/"
          ALLOWED_RELEASE_CONTROL_PATHS=(
            '.github/workflows/ci-installer-windows.yml'
            '.github/workflows/release-stable-gate.yml'
            'scripts/tests/ci-workflow-contract.test.mjs'
            'scripts/tests/installer-upgrade-e2e-contract.test.mjs'
            'docs/specs/SPEC-122_estabilizacion_release_1_2_8.spec.md'
          )
          mapfile -t POST_CANDIDATE_PATHS < <(git diff --name-only "$SOURCE_SHA..$GATE_SHA")
          (( ${#POST_CANDIDATE_PATHS[@]} > 0 )) || { echo 'Falta un commit posterior con evidencia o controles de release permitidos.' >&2; exit 1; }
          for changed_path in "${POST_CANDIDATE_PATHS[@]}"; do
            allowed=false
            if [[ "$changed_path" == "$EVIDENCE_PREFIX"* ]]; then
              allowed=true
            else
              for allowed_path in "${ALLOWED_RELEASE_CONTROL_PATHS[@]}"; do
                [[ "$changed_path" == "$allowed_path" ]] && allowed=true && break
              done
            fi
            [[ "$allowed" == true ]] || { echo "Cambio posterior al candidato fuera de las rutas permitidas: $changed_path" >&2; exit 1; }
          done
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          RUN_SHA="$(jq -r '.head_sha' <<<"$RUN")"
          RUN_BRANCH="$(jq -r '.head_branch' <<<"$RUN")"
          RUN_STATUS="$(jq -r '.conclusion' <<<"$RUN")"
          RUN_WORKFLOW="$(jq -r '.name' <<<"$RUN")"
          [[ "$RUN_SHA" == "$SOURCE_SHA" && "$RUN_BRANCH" == 'main' && "$RUN_STATUS" == 'success' && "$RUN_WORKFLOW" == 'CI Installer Windows' ]] || {
            echo 'La ejecución candidata debe ser exitosa, de CI Installer Windows y del mismo SHA de main.' >&2; exit 1;
          }
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "installer_run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Confirmar checkout candidato limpio antes de preparar QA
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          node scripts/release/assert-candidate-clean.mjs 'checkout inicial'

      - name: Descargar artefacto inmutable del build candidato
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: installer-windows
          path: dist/installer
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Resolver versión del candidato
        id: resolve_version
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(node -p "require('./package.json').version")"
          [[ "$TARGET" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "La versión estable debe ser SemVer X.Y.Z: $TARGET" >&2; exit 1; }
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Comprobar manifiesto docente-local y versión antes de QA
        env:
          TARGET_VERSION: ${{ steps.resolve_version.outputs.target }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/installer/EvaluaPro-release-manifest.json
          node scripts/release/installer-release-manifest.mjs --manifest=dist/installer/EvaluaPro-release-manifest.json
          test -s dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v"$TARGET_VERSION".exe
          test -s dist/installer/docente-local/EvaluaPro-InstallerHub-docente-local-v"$TARGET_VERSION".exe.sha256

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Preparar QA candidato y validar cada etapa de E2E visual
        working-directory: candidate
        env:
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/evaluapro-responsive-screenshots
          E2E_SCRATCH_ROOT: ${{ runner.temp }}/evaluapro-e2e-cycle
        run: |
          set -euo pipefail
          npm install --global npm@12.1.0
          npm ci --foreground-scripts
          node scripts/release/assert-candidate-clean.mjs 'npm ci'

          npx prisma generate --config=apps/backend/prisma.config.mjs
          node scripts/release/assert-candidate-clean.mjs 'generación de Prisma'

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          node scripts/release/assert-candidate-clean.mjs 'instalación de Poppler'

          npx playwright install --with-deps chromium
          node scripts/release/assert-candidate-clean.mjs 'instalación de Playwright'

          npm run gui:screen-matrix
          git restore -- docs/release/manual/gui-screen-matrix.md reports/qa/latest/gui-screen-matrix.json
          node scripts/release/assert-candidate-clean.mjs 'matriz GUI'

          npm run test:gui:visual-contract
          node scripts/release/assert-candidate-clean.mjs 'contrato visual'

          E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/evaluapro-responsive-playwright-results" \
            npm run test:gui:responsive:e2e:ci
          node scripts/release/assert-candidate-clean.mjs 'E2E responsive'

          E2E_SCRATCH_ROOT="$E2E_SCRATCH_ROOT" \
            E2E_PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/evaluapro-cycle-playwright-results" \
            npm run test:gui:cycle:e2e:ci
          node scripts/release/assert-candidate-clean.mjs 'E2E de ciclo'

          E2E_REPORT_DIR="$RUNNER_TEMP/evaluapro-pdf-edge-results" \
            E2E_BROWSER_CHANNEL=chromium \
            npm run test:gui:pdf:e2e:ci
          node scripts/release/assert-candidate-clean.mjs 'E2E PDF'

      - name: Confirmar árbol fuente limpio antes de QA completa
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          node scripts/release/assert-candidate-clean.mjs 'guard final previo a QA completa'

      - name: Generar evidencia QA completa del SHA candidato
        working-directory: candidate
        run: npm run qa:full

      - name: Ejecutar gate estable
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_VERSION: ${{ steps.resolve_version.outputs.target }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          EVIDENCE_DIR: ${{ inputs.evidence_dir }}
          RELEASE_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          INSTALLER_RUN_ID: ${{ steps.candidate.outputs.installer_run_id }}
          QA_MANIFEST: candidate/reports/qa/latest/manifest.json
        shell: bash
        run: |
          set -euo pipefail
          args=("--repo=$REPOSITORY" "--version=$TARGET_VERSION" "--candidate-sha=$SOURCE_SHA" "--installer-run-id=$INSTALLER_RUN_ID" "--workflow=ci.yml" "--branch=main" "--qa-manifest=$QA_MANIFEST")
          [[ -z "$EVIDENCE_DIR" ]] || args+=("--evidence-dir=$EVIDENCE_DIR")
          RELEASE_CANDIDATE_SHA="$SOURCE_SHA" node scripts/release/validate-stable-promotion.mjs "${args[@]}"

      - name: Publicar decisión de auditoría
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stable-gate-decision-${{ steps.resolve_version.outputs.target }}
          path: |
            reports/release/stable-gate/${{ steps.resolve_version.outputs.target }}/decision.json
            candidate/reports/qa/latest/
            candidate/test-results/**
            ${{ runner.temp }}/evaluapro-responsive-screenshots/**
            ${{ runner.temp }}/evaluapro-responsive-playwright-results/**
            ${{ runner.temp }}/evaluapro-cycle-playwright-results/**
            ${{ runner.temp }}/evaluapro-e2e-cycle/screenshots/**
            ${{ runner.temp }}/evaluapro-pdf-edge-results/**
          if-no-files-found: warn

  publish_after_go:
    name: Ejecutar publicación y E2E completa tras Go
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: stable_gate
    if: needs.stable_gate.result == 'success' && inputs.dispatch_release_after_gate == true
    permissions:
      contents: read
      actions: write
    steps:
      - name: Descargar el guard de release del commit del gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Despachar pipeline de release con E2E draft y pública
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ needs.stable_gate.outputs.target_version }}
          SOURCE_SHA: ${{ needs.stable_gate.outputs.candidate_sha }}
          GATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$TARGET_VERSION"
          response_dir="$(mktemp -d)"
          trap 'rm -rf "$response_dir"' EXIT
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >"$response_dir/release.txt" 2>/dev/null || true
          gh api --include "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >"$response_dir/tag-ref.txt" 2>/dev/null || true
          if grep -qE '^HTTP/[0-9.]+ 2[0-9]{2} ' "$response_dir/tag-ref.txt"; then
            gh api --include "repos/$GITHUB_REPOSITORY/commits/$TAG" >"$response_dir/tag.txt" 2>/dev/null || true
            if ! grep -qE '^HTTP/[0-9.]+ 2[0-9]{2} ' "$response_dir/tag.txt"; then
              echo 'La tag estable existe, pero no se pudo resolver a un commit.' >&2
              exit 1
            fi
          else
            cp "$response_dir/tag-ref.txt" "$response_dir/tag.txt"
          fi
          node scripts/release/validate-existing-stable-draft.mjs \
            "--release-response=$response_dir/release.txt" \
            "--tag-response=$response_dir/tag.txt" \
            "--tag=$TAG" \
            "--source-sha=$SOURCE_SHA"
          dispatch_result="$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci-installer-windows.yml/dispatches" \
            -F return_run_details=true \
            -f ref=main \
            -f "inputs[source_sha]=$SOURCE_SHA" \
            -f "inputs[release_tag]=$TAG")"
          run_id="$(jq -r '.workflow_run_id // empty' <<<"$dispatch_result")"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'GitHub no devolvió el run_id del pipeline de publicación.' >&2; exit 1; }
          deadline=$((SECONDS + 21000))
          while (( SECONDS < deadline )); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // empty')"
            echo "CI Installer Windows run=$run_id status=$status conclusion=${conclusion:-pending}"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || { gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true; exit 1; }
              echo "release_run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo 'Timeout esperando publicación y E2E pública del instalador.' >&2
          exit 1

  mark_latest:
    name: Marcar como Latest después de verificar el asset
    runs-on: ubuntu-latest
    needs: [stable_gate, publish_after_go]
    permissions:
      contents: write
    steps:
      - name: Promover release verificado a Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ needs.stable_gate.outputs.target_version }}
        run: gh release edit "v$TARGET_VERSION" --repo "$GITHUB_REPOSITORY" --latest

  cleanup_same_sha_beta:
    name: Retirar beta temporal del mismo SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [stable_gate, publish_after_go, mark_latest]
    if: needs.stable_gate.result == 'success' && needs.publish_after_go.result == 'success' && needs.mark_latest.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Descargar código del gate estable
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Calcular candidatos beta removibles
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ needs.stable_gate.outputs.target_version }}
          CANDIDATE_SHA: ${{ needs.stable_gate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          stable_tag="v$TARGET_VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$stable_tag" > "$RUNNER_TEMP/stable-release.json"
          stable_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$stable_tag" --jq '.sha')"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | [.tag_name, (.draft|tostring), (.prerelease|tostring)] | @tsv' > "$RUNNER_TEMP/releases.tsv"
          : > "$RUNNER_TEMP/betas.tsv"
          : > "$RUNNER_TEMP/beta-tags.tsv"
          beta_regex="^v${TARGET_VERSION//./\\.}-beta\\.(0|[1-9][0-9]*)$"
          while IFS=$'\t' read -r tag draft prerelease; do
            [[ "$tag" =~ $beta_regex && "$draft" == false && "$prerelease" == true ]] || continue
            printf '%s\n' "$tag" >> "$RUNNER_TEMP/beta-tags.tsv"
            beta_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
            printf '%s\t%s\n' "$tag" "$beta_sha" >> "$RUNNER_TEMP/betas.tsv"
          done < "$RUNNER_TEMP/releases.tsv"
          node --input-type=module - "$RUNNER_TEMP/stable-release.json" "$stable_sha" "$RUNNER_TEMP/beta-tags.tsv" "$RUNNER_TEMP/betas.tsv" "$RUNNER_TEMP/beta-cleanup-plan.json" <<'NODE'
          import fs from 'node:fs';
          import { planBetaCleanup } from './scripts/release/plan-beta-cleanup.mjs';
          const [stablePath, stableTagSha, betaTagsPath, betaCommitsPath, outputPath] = process.argv.slice(2);
          const betaReleases = fs.readFileSync(betaTagsPath, 'utf8').split(/\r?\n/).filter(Boolean).map((tag_name) => ({ tag_name, draft: false, prerelease: true }));
          const tagCommits = Object.fromEntries(fs.readFileSync(betaCommitsPath, 'utf8').split(/\r?\n/).filter(Boolean).map((line) => line.split('\t')));
          const plan = planBetaCleanup({
            version: process.env.TARGET_VERSION,
            candidateSha: process.env.CANDIDATE_SHA,
            stableRelease: JSON.parse(fs.readFileSync(stablePath, 'utf8')),
            stableTagSha,
            betaReleases,
            tagCommits
          });
          fs.writeFileSync(outputPath, `${JSON.stringify(plan, null, 2)}\n`);
          console.log(JSON.stringify(plan));
          NODE
          echo "plan_file=$RUNNER_TEMP/beta-cleanup-plan.json" >> "$GITHUB_OUTPUT"

      - name: Retirar exclusivamente prereleases beta del SHA publicado
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_FILE: ${{ steps.plan.outputs.plan_file }}
          CANDIDATE_SHA: ${{ needs.stable_gate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || { echo "Tag beta inesperada: $tag" >&2; exit 1; }
            current_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            [[ "$(jq -r '.draft' <<<"$current_release")" == false && "$(jq -r '.prerelease' <<<"$current_release")" == true ]] || { echo "La beta $tag cambió de estado después del plan; se conserva." >&2; exit 1; }
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
            [[ "${current_sha,,}" == "${CANDIDATE_SHA,,}" ]] || { echo "La beta $tag ya no apunta al SHA estable candidato; se conserva." >&2; exit 1; }
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "Retirada beta temporal $tag del SHA estable verificado." >> "$GITHUB_STEP_SUMMARY"
          done < <(node -e 'const p=require(process.argv[1]); for(const tag of p.remove) console.log(tag)' "$PLAN_FILE")
          if [[ "$(node -e 'const p=require(process.argv[1]); process.stdout.write(String(p.remove.length))' "$PLAN_FILE")" == '0' ]]; then
            echo 'No había beta temporal del SHA candidato que retirar.' >> "$GITHUB_STEP_SUMMARY"
          fi
          node -e 'const p=require(process.argv[1]); for(const item of p.preserve) console.log(`Conservada ${item.tag} (SHA distinto)`)' "$PLAN_FILE" >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module - "$PLAN_FILE" "$RUNNER_TEMP/beta-stable-transition.json" <<'NODE'
          import fs from 'node:fs';
          const [planPath, outputPath] = process.argv.slice(2);
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const report = {
            schemaVersion: 1,
            estado: 'verificado',
            generadoEn: new Date().toISOString(),
            version: plan.version,
            candidateSha: plan.candidateSha,
            stableRelease: { tag: plan.stableTag, url: plan.stableReleaseUrl, publishedAt: plan.stablePublishedAt },
            prereleasesTemporalesRetiradas: plan.remove,
            prereleasesConservadasShaDistinto: plan.preserve
          };
          fs.writeFileSync(outputPath, `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report));
          NODE
      - name: Conservar reporte de transición beta-estable
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: beta-stable-transition-${{ needs.stable_gate.outputs.target_version }}
          path: |
            ${{ runner.temp }}/beta-cleanup-plan.json
            ${{ runner.temp }}/beta-stable-transition.json
          if-no-files-found: warn

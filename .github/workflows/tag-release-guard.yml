name: Tag Release Guard

on:
  push:
    tags:
      - "v*"

concurrency:
  group: tag-release-guard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag_release_guard:
    name: Validar tag con release asociado
    runs-on: ubuntu-latest
    # El build del instalador (60 min) y la publicación (15 min) son jobs secuenciales.
    # La espera cubre ambos límites con margen y conserva la tag si vence.
    timeout-minutes: 100
    outputs:
      invalid_tag: ${{ steps.guard.outputs.invalid_tag }}

    steps:
      - name: Esperar release para el tag
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          max_attempts=170
          sleep_seconds=30

          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Formato de tag no permitido: $TAG_NAME" >&2
            echo "invalid_tag=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          for attempt in $(seq 1 "$max_attempts"); do
            if gh release view "$TAG_NAME" --repo "$REPOSITORY" > /dev/null 2>&1; then
              echo "Release encontrado para $TAG_NAME"
              exit 0
            fi

            echo "[$attempt/$max_attempts] Aun no existe release para $TAG_NAME; reintentando en ${sleep_seconds}s"
            sleep "$sleep_seconds"
          done

          echo "No se encontro release para $TAG_NAME dentro de la ventana de espera." >&2
          echo "La tag se conserva para permitir reintento y diagnostico." >&2
          exit 1


  cleanup_invalid_tag:
    name: Eliminar tag de formato inválido
    runs-on: ubuntu-latest
    needs: tag_release_guard
    if: always() && needs.tag_release_guard.outputs.invalid_tag == 'true'
    permissions:
      contents: write
    steps:
      - name: Eliminar referencia de tag inválida
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ || ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Refusing to delete unless the tag is invalid and the repository is valid." >&2
            exit 1
          fi
          gh api --method DELETE "repos/$REPOSITORY/git/refs/tags/$TAG_NAME"

name: Package Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  empaquetado:
    name: Empaquetar imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Resolver metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(String(packageJson.version))")"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "La tag $GITHUB_REF_NAME no coincide con package.json ($VERSION)." >&2
            exit 1
          fi
          SHA_SHORT="${GITHUB_SHA::12}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${GITHUB_REPOSITORY,,}/evaluapro-api-docente" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${GITHUB_REPOSITORY,,}/evaluapro-web-docente" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etapa package (Docker build)
        run: |
          docker build -f apps/backend/Dockerfile \
            -t ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.version }} \
            -t ${{ steps.meta.outputs.api_image }}:${{ github.sha }} \
            -t ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.sha_short }} .
          docker build -f apps/frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL=http://localhost:4000/api \
            --build-arg VITE_APP_DESTINO=docente \
            -t ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.version }} \
            -t ${{ steps.meta.outputs.web_image }}:${{ github.sha }} \
            -t ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.sha_short }} .

      - name: Publicar imágenes GHCR
        run: |
          docker push ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.version }}
          docker push ${{ steps.meta.outputs.api_image }}:${{ github.sha }}
          docker push ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.sha_short }}
          docker push ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.version }}
          docker push ${{ steps.meta.outputs.web_image }}:${{ github.sha }}
          docker push ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.sha_short }}

      - name: Exportar IDs de imágenes
        run: |
          {
            echo "${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.version }} $(docker image inspect ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.version }} --format='{{.Id}}')"
            echo "${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.version }} $(docker image inspect ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.version }} --format='{{.Id}}')"
          } > image-digests.txt

      - name: Publicar artefacto
        uses: actions/upload-artifact@v6
        with:
          name: image-digests
          path: image-digests.txt

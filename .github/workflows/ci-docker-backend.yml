name: CI Docker Backend

on:
  pull_request:
    paths:
      - ".github/workflows/ci-docker-backend.yml"
      - "apps/backend/**"
      - ".dockerignore"
      - "apps/frontend/package.json"
      - "apps/frontend/package-lock.json"
      - "apps/portal_alumno_cloud/package.json"
      - "apps/portal_alumno_cloud/package-lock.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/tests/ci-workflow-contract.test.mjs"
      - "tsconfig.base.json"

permissions:
  contents: read

concurrency:
  group: ci-docker-backend-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.head_ref }}
  cancel-in-progress: true

jobs:
  build_backend_image:
    name: Build Docker backend (sin publicar)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Construir imagen backend para validar Dockerfile
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: docker build --file apps/backend/Dockerfile --tag "evaluapro-backend:pr-${GITHUB_SHA}" .


name: Auto-Generate Docs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: autogen-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autogen_docs:
    name: Generar docs
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Etapa setup
        run: |
          npm install --global npm@12.1.0
          npm ci --foreground-scripts

      - name: Preparar runtime sharp (linux-x64)
        run: npm install --no-save --include=optional --os=linux --cpu=x64 sharp

      - name: Generar docs y diagramas
        run: |
          npm run diagramas:generate
          npm run diagramas:render:linux
          npm run docs:generate

      - name: Crear parche de docs generados
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          git add docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary -- docs > docs-autogen.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Cargar parche de docs
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: autogen-docs-patch
          path: docs-autogen.patch
          if-no-files-found: error

  publish_docs:
    name: Publicar docs generados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: autogen_docs
    if: needs.autogen_docs.outputs.changed == 'true'
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Descargar parche generado
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: autogen-docs-patch

      - name: Commit y push si hay cambios
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/* ]] || ! git check-ref-format "refs/heads/$TARGET_BRANCH"; then
            echo "Ref destino no es una rama valida: $TARGET_BRANCH" >&2
            exit 1
          fi
          git apply --index docs-autogen.patch
          if git diff --cached --quiet; then
            echo "El parche generado no contiene cambios aplicables." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(docs): autogenerar docs y diagramas"
          if ! git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
            echo "::warning::No se pudo hacer push automático (rama protegida o reglas de repositorio)."
            echo "::warning::Los docs se generaron, pero deben incorporarse por PR/manualmente."
          fi

name: CI Frontend Module

on:
  push:
    branches:
      - "main"
      - "release/**"
    paths:
      - "apps/frontend/**"
      - "client/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "vitest.base.ts"
      - "scripts/retry.mjs"
      - "scripts/testing/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "client/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "vitest.base.ts"
      - "scripts/retry.mjs"
      - "scripts/testing/**"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detectar_cambios:
    name: Detectar Cambios Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      escalation: ${{ steps.affected.outputs.escalation }}
      frontend: ${{ steps.affected.outputs.group_frontend }}
      shared: ${{ steps.affected.outputs.group_shared }}
      job_core_frontend: ${{ steps.affected.outputs.job_core_frontend }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolver impacto canónico de CI
        id: affected
        run: node scripts/testing/resolve-affected-ci.mjs --github-output="$GITHUB_OUTPUT" > reports.affected-ci.json

  frontend_module:
    name: Frontend Module
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - detectar_cambios
    if: github.event_name == 'workflow_dispatch' || needs.detectar_cambios.outputs.frontend == 'true' || needs.detectar_cambios.outputs.shared == 'true' || needs.detectar_cambios.outputs.job_core_frontend == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Etapa setup
        run: npm ci --foreground-scripts


      - name: Etapa lint frontend
        run: npm -C apps/frontend run lint

      - name: Etapa typecheck frontend
        run: npm -C apps/frontend run typecheck

      - name: Etapa test frontend
        run: npm run test:frontend:ci

      - name: Etapa ux-quality-check
        run: npm run test:ux-quality:ci

      - name: Etapa coverage frontend
        run: npm -C apps/frontend run test:coverage

      - name: Etapa proyectos client
        run: npm run test:client:proyectos:ci

      - name: Etapa tdd-debt-check
        run: npm run test:coverage:exclusions:debt

      - name: Preparar base para diff coverage (PR)
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Etapa diff-coverage-check
        run: npm run test:coverage:diff -- --apps frontend

      - name: Etapa build frontend
        run: npm -C apps/frontend run build

name: CI Frontend Module

on:
  push:
    branches:
      - "main"
      - "release/**"
    paths:
      - "apps/frontend/**"
      - "client/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "vitest.base.ts"
      - "scripts/retry.mjs"
      - "scripts/testing/**"
      - "scripts/wcag-guard.mjs"
      - "scripts/tests/ui-contrast-audit.mjs"
      - "scripts/tests/wcag-guard.contract.test.mjs"
      - "docs/WCAG_UI_POLICY.md"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "client/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "vitest.base.ts"
      - "scripts/retry.mjs"
      - "scripts/testing/**"
      - "scripts/wcag-guard.mjs"
      - "scripts/tests/ui-contrast-audit.mjs"
      - "scripts/tests/wcag-guard.contract.test.mjs"
      - "docs/WCAG_UI_POLICY.md"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detectar_cambios:
    name: Detectar Cambios Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      escalation: ${{ steps.affected.outputs.escalation }}
      frontend: ${{ steps.affected.outputs.group_frontend }}
      shared: ${{ steps.affected.outputs.group_shared }}
      job_core_frontend: ${{ steps.affected.outputs.job_core_frontend }}

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolver impacto canónico de CI
        id: affected
        run: node scripts/testing/resolve-affected-ci.mjs --github-output="$GITHUB_OUTPUT" > reports.affected-ci.json

  frontend_module:
    name: Frontend Module
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - detectar_cambios
    if: github.event_name == 'workflow_dispatch' || needs.detectar_cambios.outputs.frontend == 'true' || needs.detectar_cambios.outputs.shared == 'true' || needs.detectar_cambios.outputs.job_core_frontend == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Etapa setup
        run: |
          npm install --global npm@12.1.0
          npm ci --foreground-scripts


      - name: Guardrail WCAG
        run: npm run guard:wcag -- --skip-lint

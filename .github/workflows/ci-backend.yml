name: CI Backend Module

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.event.pull_request.head.ref) || github.event_name == 'push' && format('push-{0}', github.ref) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  detectar_cambios:
    name: Detectar Cambios Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      escalation: ${{ steps.affected.outputs.escalation }}
      backend: ${{ steps.affected.outputs.group_backend }}
      backend_omr: ${{ steps.affected.outputs.group_backend_omr }}
      shared: ${{ steps.affected.outputs.group_shared }}
      job_core_backend_portal: ${{ steps.affected.outputs.job_core_backend_portal }}

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolver impacto canónico de CI
        id: affected
        run: node scripts/testing/resolve-affected-ci.mjs --github-output="$GITHUB_OUTPUT" > reports.affected-ci.json

  backend_module:
    name: Backend Module
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - detectar_cambios
    if: github.event_name == 'workflow_dispatch' || needs.detectar_cambios.outputs.backend_omr == 'true'

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configurar Node y dependencias bloqueadas
        uses: ./.github/actions/setup-node-project

      - name: Instalar dependencias nativas de build (CV/imagen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            make \
            g++ \
            cmake \
            pkg-config \
            poppler-utils

      - name: Generar Prisma Client para pruebas OMR
        run: npx prisma generate --config=apps/backend/prisma.config.mjs

      - name: Etapa smoke OMR CV
        run: npm -C apps/backend run omr:cv:smoke

      - name: Etapa tests OMR criticos
        run: npm -C apps/backend run test -- --reporter=verbose tests/omr.cv.engine.test.ts tests/omr.etapaScoring.fallback.test.ts tests/omr.prevalidacion.test.ts tests/omr.contrato.test.ts tests/integracion/qrEscaneoOmr.test.ts tests/omr.test.ts

      - name: Etapa gate OMR canónico
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:omr:canonical:gate:ci

      - name: Publicar artefactos OMR QA
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omr-qa-reports
          path: |
            reports/qa/latest/omr/**
            reports/qa/latest/omr-canonical-gate-wrapper.json
          if-no-files-found: warn

name: CI Backend Module

on:
  push:
    branches:
      - "main"
    paths:
      - "apps/backend/**"
      - "omr_samples_tv*/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "vitest.base.ts"
      - "scripts/retry.mjs"
      - "scripts/testing/**"
      - "scripts/security-env-check.mjs"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "omr_samples_tv*/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "vitest.base.ts"
      - "scripts/retry.mjs"
      - "scripts/testing/**"
      - "scripts/security-env-check.mjs"
      - ".github/workflows/ci-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detectar_cambios:
    name: Detectar Cambios Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      escalation: ${{ steps.affected.outputs.escalation }}
      backend: ${{ steps.affected.outputs.group_backend }}
      shared: ${{ steps.affected.outputs.group_shared }}
      job_core_backend_portal: ${{ steps.affected.outputs.job_core_backend_portal }}

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolver impacto canónico de CI
        id: affected
        run: node scripts/testing/resolve-affected-ci.mjs --github-output="$GITHUB_OUTPUT" > reports.affected-ci.json

  backend_module:
    name: Backend Module
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - detectar_cambios
    if: github.event_name == 'workflow_dispatch' || needs.detectar_cambios.outputs.backend == 'true' || needs.detectar_cambios.outputs.shared == 'true' || needs.detectar_cambios.outputs.job_core_backend_portal == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/portal_alumno_cloud/package-lock.json

      - name: Instalar dependencias nativas de build (CV/imagen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            make \
            g++ \
            cmake \
            pkg-config \
            poppler-utils

      - name: Etapa setup
        run: |
          npm install --global npm@12.1.0
          npm ci --foreground-scripts

      - name: Generar Prisma Client para pruebas OMR
        run: npx prisma generate --config=apps/backend/prisma.config.mjs

      - name: Preparar runtime CV nativo (linux-x64)
        run: npm install --no-save --include=optional --os=linux --cpu=x64 sharp

      - name: Etapa smoke OMR CV
        run: npm -C apps/backend run omr:cv:smoke

      - name: Etapa tests OMR criticos
        run: npm -C apps/backend run test -- --reporter=verbose tests/omr.cv.engine.test.ts tests/omr.etapaScoring.fallback.test.ts tests/omr.prevalidacion.test.ts tests/omr.contrato.test.ts tests/integracion/qrEscaneoOmr.test.ts tests/omr.test.ts

      - name: Etapa gate OMR canónico
        run: npm run test:omr:canonical:gate:ci

      - name: Publicar artefactos OMR QA
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omr-qa-reports
          path: |
            reports/qa/latest/omr/**
            reports/qa/latest/omr-canonical-gate-wrapper.json
          if-no-files-found: warn

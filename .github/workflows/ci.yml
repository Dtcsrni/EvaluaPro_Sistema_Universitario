name: CI Checks

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:
    inputs:
      force_full_ci:
        description: "Forzar corrida completa del CI"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.event.pull_request.head.ref) || github.event_name == 'push' && format('push-{0}', github.ref) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  detectar_cambios:
    name: Detectar Cambios CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      escalation: ${{ steps.affected.outputs.escalation }}
      shared_core: ${{ steps.affected.outputs.group_shared }}
      backend: ${{ steps.affected.outputs.group_backend }}
      frontend: ${{ steps.affected.outputs.group_frontend }}
      portal: ${{ steps.affected.outputs.group_portal }}
      installer: ${{ steps.affected.outputs.group_installer }}
      release: ${{ steps.affected.outputs.group_release }}
      docs: ${{ steps.affected.outputs.group_docs }}
      compliance: ${{ steps.affected.outputs.group_compliance }}
      gate_flujo_docente_check: ${{ steps.affected.outputs.gate_flujo_docente_check }}
      gate_dataset_prodlike_check: ${{ steps.affected.outputs.gate_dataset_prodlike_check }}
      gate_omr_tv_extended_gate: ${{ steps.affected.outputs.gate_omr_tv_extended_gate }}
      gate_docente_alumno_e2e_check: ${{ steps.affected.outputs.gate_docente_alumno_e2e_check }}
      gate_global_grade_check: ${{ steps.affected.outputs.gate_global_grade_check }}
      gate_pdf_print_check: ${{ steps.affected.outputs.gate_pdf_print_check }}
      gate_classroom_audit_check: ${{ steps.affected.outputs.gate_classroom_audit_check }}
      gate_ux_visual_check: ${{ steps.affected.outputs.gate_ux_visual_check }}
      gate_perf_check: ${{ steps.affected.outputs.gate_perf_check }}
      gate_perf_business_check: ${{ steps.affected.outputs.gate_perf_business_check }}
      gate_clean_architecture_check: ${{ steps.affected.outputs.gate_clean_architecture_check }}
      gate_qa_manifest: ${{ steps.affected.outputs.gate_qa_manifest }}
      gate_dsr_flow_test: ${{ steps.affected.outputs.gate_dsr_flow_test }}
      gate_compliance_evidence: ${{ steps.affected.outputs.gate_compliance_evidence }}
      job_core_contract_docs_gov: ${{ steps.affected.outputs.job_core_contract_docs_gov }}
      job_core_backend_portal: ${{ steps.affected.outputs.job_core_backend_portal }}
      job_core_frontend: ${{ steps.affected.outputs.job_core_frontend }}
      job_core_security_compliance: ${{ steps.affected.outputs.job_core_security_compliance }}
      job_ext_funcionales: ${{ steps.affected.outputs.job_ext_funcionales }}
      job_ext_perf_arquitectura: ${{ steps.affected.outputs.job_ext_perf_arquitectura }}
      job_ext_compliance_evidencia: ${{ steps.affected.outputs.job_ext_compliance_evidencia }}

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolver impacto canónico de CI
        id: affected
        run: node scripts/testing/resolve-affected-ci.mjs --github-output="$GITHUB_OUTPUT" > reports.affected-ci.json

  core_contract_docs_gov:
    name: Core Contract/Docs/Gov
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - detectar_cambios
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.job_core_contract_docs_gov == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configurar Node y dependencias bloqueadas
        uses: ./.github/actions/setup-node-project

      - name: Resolver mapa de suites afectadas
        run: npm run test:ci:affected:resolve > reports.affected-ci.json

      - name: Etapa contract-check
        run: npm run pipeline:contract:check

      - name: Etapa governance-policy-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.release == 'true' || needs.detectar_cambios.outputs.installer == 'true' || needs.detectar_cambios.outputs.shared_core == 'true'
        run: |
          npm run test:ruleset:policy
          npm run test:release:policy
          npm run test:security:policy

      - name: Etapa installer-contract-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.installer == 'true' || needs.detectar_cambios.outputs.shared_core == 'true'
        run: |
          npm run test:installer-hub:contract
          npm run test:wix:policy

      - name: Etapa docs-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.docs == 'true' || needs.detectar_cambios.outputs.shared_core == 'true'
        run: |
          npm run docs:generate
          npm run docs:check
          npm run diagramas:check
          rm -rf ~/.cache/puppeteer
          npx puppeteer browsers install chrome
          npm run diagramas:render
          npm run diagramas:consistencia:check
          npm run routes:check

      - name: Publicar reporte affected CI
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reports-affected-ci
          path: reports.affected-ci.json
          if-no-files-found: warn

  core_backend_portal:
    name: Core Backend/Portal
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - detectar_cambios
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.job_core_backend_portal == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configurar Node y dependencias bloqueadas
        uses: ./.github/actions/setup-node-project

      - name: Preparar runtime PDF (poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Etapa lint backend
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.backend == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm -C apps/backend run lint

      - name: Etapa lint portal
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.portal == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm -C apps/portal_alumno_cloud run lint

      - name: Etapa typecheck backend
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.backend == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm -C apps/backend run typecheck

      - name: Etapa typecheck portal
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.portal == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm -C apps/portal_alumno_cloud run typecheck

      - name: Etapa test backend
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.backend == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        env:
          BACKEND_TEST_CHANGED_FROM: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: npm run test:backend:ci

      - name: Etapa test portal
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.portal == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        env:
          VITEST_CHANGED_FROM: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: |
          if [[ -n "$VITEST_CHANGED_FROM" ]] && ! git diff --quiet "$VITEST_CHANGED_FROM...HEAD" -- apps/portal_alumno_cloud/src apps/portal_alumno_cloud/tests; then
            npm -C apps/portal_alumno_cloud run test -- --changed="$VITEST_CHANGED_FROM" --reporter=default
          else
            npm run test:portal:ci
          fi

      - name: Etapa classroom-audit-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_classroom_audit_check == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run test:classroom:audit:ci

      - name: Etapa contrato del runner de cobertura backend
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.backend == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: node --test scripts/tests/backend-coverage-batches.test.mjs

      - name: Etapa coverage backend
        if: (github.event_name == 'workflow_dispatch' && inputs.force_full_ci)
        env:
          BACKEND_COVERAGE_BATCH_TIMEOUT_MS: "5400000"
          BACKEND_COVERAGE_COMPARE_ISOLATED: "true"
          BACKEND_COVERAGE_CHANGED_FROM: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: npm -C apps/backend run test:coverage

      - name: Publicar diagnóstico de cobertura backend
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-coverage-diagnostics
          path: |
            apps/backend/.vitest-reports/**/run-summary.json
            apps/backend/.vitest-reports/backend-coverage-logs/*.log
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

      - name: Etapa coverage portal
        if: (github.event_name == 'workflow_dispatch' && inputs.force_full_ci)
        env:
          MODULE_COVERAGE_CHANGED_FROM: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: node scripts/testing/run-module-coverage.mjs --apps portal

      - name: Etapa tdd-debt-check
        run: npm run test:coverage:exclusions:debt


      - name: Etapa build backend
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.backend == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm -C apps/backend run build

      - name: Etapa build portal
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.portal == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm -C apps/portal_alumno_cloud run build

  core_frontend:
    name: Core Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - detectar_cambios
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.job_core_frontend == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Preparar snapshot WCAG v1.1.6
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin 53e0590244c55e4ff7f9104c6ea4dd1c5c2a2e12

      - name: Configurar Node y dependencias bloqueadas
        uses: ./.github/actions/setup-node-project


      - name: Etapa lint frontend
        run: npm -C apps/frontend run lint

      - name: Guardrail WCAG
        run: npm run guard:wcag -- --skip-lint

      - name: Etapa typecheck frontend
        run: npm -C apps/frontend run typecheck

      - name: Etapa test frontend
        env:
          VITEST_CHANGED_FROM: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: |
          if [[ -n "$VITEST_CHANGED_FROM" ]] && ! git diff --quiet "$VITEST_CHANGED_FROM...HEAD" -- apps/frontend/src apps/frontend/tests; then
            npm -C apps/frontend run test -- --changed="$VITEST_CHANGED_FROM" --pool=forks --reporter=default
          else
            npm run test:frontend:ci
          fi

      - name: Etapa test client proyectos
        run: npm run test:client:proyectos:ci

      - name: Etapa ux-quality-check
        run: npm run test:ux-quality:ci

      - name: Etapa coverage frontend
        if: (github.event_name == 'workflow_dispatch' && inputs.force_full_ci)
        env:
          MODULE_COVERAGE_CHANGED_FROM: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: node scripts/testing/run-module-coverage.mjs --apps frontend

      - name: Etapa tdd-debt-check
        run: npm run test:coverage:exclusions:debt


      - name: Etapa build frontend
        run: npm -C apps/frontend run build

  core_security_compliance:
    name: Core Security/Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - detectar_cambios
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.job_core_security_compliance == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configurar Node y dependencias bloqueadas
        uses: ./.github/actions/setup-node-project

      - name: Etapa security-scan
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.backend == 'true' || needs.detectar_cambios.outputs.portal == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        env:
          NODE_ENV: production
          STRICT_ENV_CHECK: "1"
        run: |
          set -euo pipefail
          export BACKEND_DATABASE_URL='file:./data/evaluapro_ci.db'
          export JWT_SECRETO="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("hex"))')"
          export PORTAL_ALUMNO_API_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          npm run security:env:check
          npm audit --omit=dev --audit-level=critical --json > npm-audit-report.json
          npm run security:audit

      - name: Etapa legal-docs-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.compliance == 'true' || needs.detectar_cambios.outputs.docs == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run test:compliance:legal-docs

      - name: Etapa pii-leak-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.compliance == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run test:compliance:pii

      - name: Etapa retention-policy-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.compliance == 'true' || needs.detectar_cambios.outputs.shared_core == 'true' || needs.detectar_cambios.outputs.escalation == 'full-core' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run test:compliance:retention

      - name: Publicar reporte de auditoría
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn

  verificaciones_core:
    name: Verificaciones Core (PR bloqueante)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - detectar_cambios
      - core_contract_docs_gov
      - core_backend_portal
      - core_frontend
      - core_security_compliance
    if: always()

    steps:
      - name: Descargar código del SHA evaluado
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar resultado agregado Core
        shell: bash
        env:
          CI_GATE_EVENT: ${{ github.event_name }}
          CI_GATE_FORCE_FULL: ${{ inputs.force_full_ci || false }}
          CI_GATE_SHA: ${{ github.sha }}
          CI_GATE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/testing/ci-gate-summary.mjs --mode=core --report=reports/ci-gates/core.json

      - name: Publicar decisión del gate Core
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-gate-core
          path: reports/ci-gates/core.json
          if-no-files-found: error
          retention-days: 14

  ext_funcionales:
    name: Extended Funcionales
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - detectar_cambios
      - verificaciones_core
    if: |
      !cancelled() &&
      needs.detectar_cambios.result == 'success' &&
      needs.verificaciones_core.result == 'success' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) ||
      ((github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/')) &&
      (needs.detectar_cambios.outputs.job_ext_funcionales == 'true' ||
      needs.detectar_cambios.outputs.escalation == 'full-extended')))

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configurar Node y dependencias bloqueadas
        uses: ./.github/actions/setup-node-project

      - name: Preparar Prisma backend
        run: npx prisma generate --config=apps/backend/prisma.config.mjs

      - name: Instalar Chromium para E2E visual de GUI
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.escalation == 'full-extended' || needs.detectar_cambios.outputs.gate_ux_visual_check == 'true' || needs.detectar_cambios.outputs.gate_pdf_print_check == 'true'
        run: npx playwright install --with-deps chromium

      - name: Etapa flujo-docente-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_flujo_docente_check == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run test:flujo-docente:ci

      - name: Etapa dataset-prodlike-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_dataset_prodlike_check == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run test:dataset-prodlike:ci

      - name: Etapa omr-canonical-real-gate
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_omr_tv_extended_gate == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run test:omr:canonical:gate:ci

      - name: Etapa docente-alumno-e2e-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_docente_alumno_e2e_check == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run test:e2e:docente-alumno:ci

      - name: Etapa global-grade-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_global_grade_check == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run test:global-grade:ci

      - name: Etapa pdf-print-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_pdf_print_check == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        env:
          E2E_BROWSER_CHANNEL: chromium
          E2E_REPORT_DIR: ${{ runner.temp }}/evaluapro-pdf-edge-results
        run: |
          npm run test:pdf-print:ci
          npm run test:pdf-visual:ci

      - name: Etapa ux-visual-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_ux_visual_check == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        env:
          E2E_PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/evaluapro-e2e-playwright-results
          E2E_SCRATCH_ROOT: ${{ runner.temp }}/evaluapro-e2e-cycle
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/evaluapro-e2e-screenshots
        run: |
          npm run test:ux-quality:ci
          npm run test:ux-visual:ci
          npm run test:e2e:journeys:ci

      - name: Publicar evidencia E2E funcional y visual
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-visual-${{ github.run_id }}
          path: |
            reports/qa/latest/*.json
            test-results/**
            ${{ runner.temp }}/evaluapro-e2e-playwright-results/**
            ${{ runner.temp }}/evaluapro-e2e-cycle/**
            ${{ runner.temp }}/evaluapro-pdf-edge-results/**
            ${{ runner.temp }}/evaluapro-e2e-screenshots/**
          if-no-files-found: warn
          retention-days: 14

  ext_perf_arquitectura:
    name: Extended Perf/Arquitectura
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Las mediciones ejercitan apps en memoria y no representan un despliegue.
      # Declarar test evita activar las validaciones de secretos de producción
      # durante la carga de módulos del backend.
      NODE_ENV: test
    needs:
      - detectar_cambios
      - verificaciones_core
    if: |
      !cancelled() &&
      needs.detectar_cambios.result == 'success' &&
      needs.verificaciones_core.result == 'success' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) ||
      ((github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/')) &&
      (needs.detectar_cambios.outputs.job_ext_perf_arquitectura == 'true' ||
      needs.detectar_cambios.outputs.escalation == 'full-extended')))

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configurar Node y dependencias bloqueadas
        uses: ./.github/actions/setup-node-project

      - name: Preparar Prisma backend
        run: npx prisma generate --config=apps/backend/prisma.config.mjs

      - name: Etapa perf-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_perf_check == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run perf:check

      - name: Etapa perf-business-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_perf_business_check == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: |
          npm run test:perf:contract
          npm run perf:check:business

      - name: Etapa clean-architecture-check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_clean_architecture_check == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run qa:clean-architecture:strict

      - name: Publicar reporte de performance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: perf-report
          path: |
            reports/perf/latest.json
            reports/perf/business.latest.json

  ext_compliance_evidencia:
    name: Extended Compliance/Evidencia
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - detectar_cambios
      - verificaciones_core
    if: |
      !cancelled() &&
      needs.detectar_cambios.result == 'success' &&
      needs.verificaciones_core.result == 'success' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) ||
      ((github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/')) &&
      (needs.detectar_cambios.outputs.job_ext_compliance_evidencia == 'true' ||
      needs.detectar_cambios.outputs.escalation == 'full-extended')))

    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configurar Node y dependencias bloqueadas
        uses: ./.github/actions/setup-node-project

      - name: Preparar Prisma backend
        run: npx prisma generate --config=apps/backend/prisma.config.mjs

      - name: Consolidar manifiesto QA
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_qa_manifest == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run test:qa:manifest

      - name: Etapa dsr-flow-test
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_dsr_flow_test == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run test:compliance:dsr-flow

      - name: Etapa compliance-evidence
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full_ci) || needs.detectar_cambios.outputs.gate_compliance_evidence == 'true' || needs.detectar_cambios.outputs.escalation == 'full-extended'
        run: npm run compliance:evidence:generate

      - name: Publicar artefactos QA
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qa-reports
          path: reports/qa/latest

  verificaciones_ext:
    name: Verificaciones Extendidas (Main/Release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - detectar_cambios
      - verificaciones_core
      - ext_funcionales
      - ext_perf_arquitectura
      - ext_compliance_evidencia
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))

    steps:
      - name: Descargar código del SHA evaluado
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar resultado agregado Extended
        shell: bash
        env:
          CI_GATE_EVENT: ${{ github.event_name }}
          CI_GATE_FORCE_FULL: ${{ inputs.force_full_ci || false }}
          CI_GATE_SHA: ${{ github.sha }}
          CI_GATE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/testing/ci-gate-summary.mjs --mode=extended --report=reports/ci-gates/extended.json

      - name: Publicar decisión del gate Extended
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-gate-extended
          path: reports/ci-gates/extended.json
          if-no-files-found: error
          retention-days: 14
